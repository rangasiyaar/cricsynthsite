[project]
name = "cricdata"
version = "0.1.0"
description = "Cricsheet ingest: JSON → normalised Parquet tables → BigQuery"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=16",
    "click>=8.1",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
]

attributes = [
    "rdata>=0.11",          # reads the R dataset with batting hand / bowling style
]

[project.scripts]
cricdata = "cricdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricdata"]
