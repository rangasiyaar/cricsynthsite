<!doctype html>
<html><head><meta charset="utf-8">
<!-- "A Night at the Cricket": 30 s trailer, 1080x1920. Every frame is computed by window.seek(t) (seconds), so a renderer
     can step through it frame by frame. Scenes follow marketing/night-at-the-cricket-script.md. No real players, team
     marks, numbers or game trademarks. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;800&family=Barlow+Condensed:ital,wght@0,600;1,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0a1018}
body{font-family:Barlow,sans-serif;color:#f2f2f3;position:relative}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.scene svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.frame{position:absolute;inset:34px;border:14px solid #f4f1ea;opacity:0;pointer-events:none;box-shadow:0 0 0 2000px rgba(10,16,24,0)}
.card{position:absolute;left:84px;bottom:300px;font:italic 900 118px/.92 'Barlow Condensed';text-transform:uppercase;opacity:0;
  text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 40px rgba(0,0,0,.45);white-space:nowrap}
.card.long{font-size:96px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.kicker{position:absolute;left:0;right:0;top:820px;text-align:center;font:800 30px Barlow;letter-spacing:.42em;color:#f2f2f3;opacity:0;text-shadow:0 2px 12px rgba(0,0,0,.6)}
/* collage */
#collage{background:#0a1018}
.grid{position:absolute;left:-30px;right:-70px;top:-40px;height:1240px;transform:rotate(-4deg);display:grid;
  grid-template-columns:1.2fr 1fr;grid-template-rows:1.25fr 1fr 1fr;gap:22px;padding:22px;transform-origin:50% 50%}
.pn{position:relative;overflow:hidden;border:10px solid #f4f1ea;box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0}
.pn svg{position:absolute;inset:0;width:100%;height:100%}
.pn .cap{position:absolute;left:18px;bottom:14px;font:italic 900 44px/.92 'Barlow Condensed';text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.6)}
.pn.p1{grid-row:1 / span 2}
.head{position:absolute;left:64px;right:30px;top:1300px;font:italic 900 84px/.98 'Barlow Condensed';text-transform:uppercase;white-space:nowrap}
.head .l2{background:linear-gradient(92deg,#ff4f8b 0%,#ffb347 60%,#ffd27a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* end card */
#end{background:radial-gradient(900px 700px at 50% 45%,#16263a 0%,#0a1018 70%)}
.lock{position:absolute;left:0;right:0;top:760px;display:flex;flex-direction:column;align-items:center;gap:34px}
.lk{display:flex;align-items:center;gap:30px}
.lk svg{width:128px;height:128px;color:#94bce3;overflow:visible}
.lk .w{font:600 104px/1 'Barlow Condensed';letter-spacing:.04em;text-transform:uppercase;color:#f2f2f3}
.lk .w b{font-weight:600;color:#94bce3}
.tg{font:500 30px Barlow;letter-spacing:.14em;color:#8ea6bd;text-transform:uppercase}
.url{font:italic 900 56px 'Barlow Condensed';letter-spacing:.06em;color:#ffb347;text-transform:uppercase;margin-top:40px}
.fonts{position:absolute;left:-9999px}
</style></head><body>
<div class="fonts"><span style="font:italic 900 20px 'Barlow Condensed'">A</span><span style="font:600 20px 'Barlow Condensed'">A</span><span style="font:800 20px Barlow">A</span><span style="font:500 20px Barlow">A</span></div>

<script>
const $ = (s) => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIO = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
// scene windows [start, end, freeze time]
const S = { s1: [0, 2.5], s2: [2.5, 6.0, 4.55], s3: [6.0, 9.5, 8.35], s4: [9.5, 13.0, 11.75], s5: [13.0, 16.5, 14.85], s6: [16.5, 21.0, 19.6] };
const H1 = "NOBODY KNOWS HOW IT ENDS.", H2 = "WE JUST GET THERE FIRST.";

function show(id, on) { $('#' + id).style.visibility = on ? 'visible' : 'hidden'; }
function setFreeze(id, t, f) {
  const sc = $('#' + id), dt = t - f;
  const fr = sc.querySelector('.frame'), cd = sc.querySelector('.card'), fl = sc.querySelector('.flash');
  if (dt < 0) { fr.style.opacity = 0; cd.style.opacity = 0; fl.style.opacity = 0; sc.querySelector('.cam').style.filter = ''; return; }
  fl.style.opacity = (0.55 * (1 - seg(dt, 0, 0.16))).toFixed(3);
  fr.style.opacity = seg(dt, 0, 0.08).toFixed(3);
  const k = ease(seg(dt, 0.04, 0.34));
  cd.style.opacity = k.toFixed(3);
  cd.style.transform = `translateX(${(-80 * (1 - k)).toFixed(1)}px) skewX(-4deg)`;
  sc.querySelector('.cam').style.filter = 'saturate(1.22) contrast(1.06)';
}
function cam(id, t, a, b, from = 1, to = 1.1, dx = 0, dy = 0, frozenAt = null) {
  const tt = frozenAt != null ? Math.min(t, frozenAt) : t;
  const p = easeIO(seg(tt, a, b));
  const s = from + (to - from) * p;
  $('#' + id + ' .cam').style.transform = `translate(${dx * p}px, ${dy * p}px) scale(${s})`;
}

// scene 2: ball flight along the quadratic, trail drawn behind
function quad(p, a, c, b) { const u = 1 - p; return [u * u * a[0] + 2 * u * p * c[0] + p * p * b[0], u * u * a[1] + 2 * u * p * c[1] + p * p * b[1]]; }
const trail = $('#s2trail'); const TL = trail.getTotalLength();
trail.style.strokeDasharray = `2 7`;
function s2(t) {
  const f = S.s2[2], tt = Math.min(t, f);
  const p = ease(seg(tt, 2.75, f));
  const [x, y] = quad(p, [196, 560], [262, 300], [336, 252]);
  $('#s2ball').setAttribute('transform', `translate(${x} ${y}) scale(${1 - 0.25 * p})`);
  trail.style.opacity = p > 0.02 ? .85 : 0;
  trail.setAttribute('d', `M196 560 Q${196 + (262 - 196) * p} ${560 + (300 - 560) * p} ${x} ${y}`);
  $('#s2beams').style.opacity = (0.75 + 0.25 * Math.sin(tt * 2.2)).toFixed(3);
  cam('s2', t, 2.5, 6.0, 1.0, 1.12, 0, 40, f);
  setFreeze('s2', t, f);
}
// scene 3: walking towards the light
function s3(t) {
  const f = S.s3[2], tt = Math.min(t, f), w = (tt - 6.0);
  const sw = Math.sin(w * 5.2) * 0.16;
  $('#s3legL').setAttribute('transform', `rotate(${(sw * 57).toFixed(2)} 183 504)`);
  $('#s3legR').setAttribute('transform', `rotate(${(-sw * 57).toFixed(2)} 217 504)`);
  const sc = 1 + 0.22 * ease(seg(tt, 6.0, f)), bob = Math.abs(Math.sin(w * 5.2)) * -4;
  $('#s3bat').setAttribute('transform', `translate(200 600) scale(${sc}) translate(-200 ${-600 + bob})`);
  $('#s3shadow').setAttribute('transform', `translate(200 600) scale(${sc}) translate(-200 -600)`);
  let d = '';
  for (let i = 0; i < 14; i++) {
    const ph = ((w * 0.6 + i * 0.137) % 1), x = 150 + ((i * 53) % 100) + Math.sin(i + w) * 6, y = 600 - ph * 160;
    d += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1 + (i % 3) * 0.6).toFixed(1)}" opacity="${(0.7 * (1 - ph)).toFixed(2)}"/>`;
  }
  $('#s3dust').innerHTML = d;
  cam('s3', t, 6.0, 9.5, 1.04, 1.14, 0, -30, f);
  setFreeze('s3', t, f);
}
// scene 4: the coin rises and spins about a horizontal axis, face up at the freeze
function s4(t) {
  const f = S.s4[2], tt = Math.min(t, f), u = tt - 9.6;
  const rise = ease(seg(tt, 9.6, f));
  const y = 600 - rise * 300, sz = 0.7 + 0.45 * rise;
  const w0 = 22, k = 1.6, total = (w0 / k) * (1 - Math.exp(-k * Math.max(0, f - 9.6)));
  let phase = (w0 / k) * (1 - Math.exp(-k * Math.max(0, u)));
  phase += (Math.round(total / Math.PI) * Math.PI - total) * clamp(u / (f - 9.6));  // land face-on at the freeze
  const c = Math.cos(phase), ry = Math.max(3, Math.abs(c) * 36);
  $('#s4coin').setAttribute('transform', `translate(200 ${y.toFixed(1)}) scale(${sz.toFixed(3)}) rotate(-12)`);
  $('#s4face').setAttribute('ry', ry.toFixed(2)); $('#s4rim').setAttribute('ry', ry.toFixed(2));
  $('#s4ring').setAttribute('ry', (ry * 0.78).toFixed(2));
  $('#s4mark').setAttribute('transform', `scale(1 ${(Math.max(0.05, Math.abs(c)) * 0.82).toFixed(3)})`);
  $('#s4mark').style.opacity = c > 0 ? 1 : 0.0;
  $('#s4face').setAttribute('fill', c > 0 ? 'url(#hot)' : '#e7774f');
  cam('s4', t, 9.5, 13.0, 1.0, 1.08, 0, 0, f);
  setFreeze('s4', t, f);
}
// scene 5: the ball skids in, the stumps burst
const STB = [[170, 560], [200, 560], [230, 560]];
function s5(t) {
  const f = S.s5[2], tt = Math.min(t, f), hit = 14.25;
  const bp = ease(seg(tt, 13.4, hit));
  if (tt < hit) $('#s5ball').setAttribute('transform', `translate(${-20 + bp * 222} ${520 + bp * 20}) rotate(${bp * 540})`);
  else { const a = tt - hit; $('#s5ball').setAttribute('transform', `translate(${202 + a * 90} ${540 + a * 30}) rotate(${540 + a * 400})`); }
  const a = Math.max(0, tt - hit);
  const rot = [-1, 0.25, 1].map((d, i) => d * (28 + i * 4) * ease(a / 0.35) + (i === 1 ? -8 * ease(a / 0.35) : 0));
  ['#st1', '#st2', '#st3'].forEach((id, i) => {
    const [x, y] = STB[i]; const lift = i === 1 ? -20 * ease(a / 0.3) : 0;
    $(id).setAttribute('transform', `translate(${x} ${y + lift}) rotate(${rot[i].toFixed(2)})`);
  });
  const bail = (dx, vx, vy, spin) => `translate(${dx + vx * a} ${348 - vy * a + 260 * a * a}) rotate(${spin * a * 360})`;
  $('#bl1').setAttribute('transform', a ? bail(184, -120, 260, -1.4) : `translate(184 348)`);
  $('#bl2').setAttribute('transform', a ? bail(216, 140, 300, 1.7) : `translate(216 348)`);
  $('#s5spark').style.opacity = a > 0 ? (1 - seg(a, 0.05, 0.5)).toFixed(3) : 0;
  const shake = a > 0 && a < 0.25 && t < f ? Math.sin(a * 90) * 6 * (1 - a / 0.25) : 0;
  cam('s5', t, 13.0, 16.5, 1.02, 1.1, shake, 0, f);
  setFreeze('s5', t, f);
}
// scene 6: the rooftop fan looks up at the ground
function s6(t) {
  const f = S.s6[2], tt = Math.min(t, f);
  $('#s6glow').style.opacity = (0.8 + 0.2 * Math.sin(tt * 3)).toFixed(3);
  $('#s6stad').style.opacity = (0.75 + 0.25 * Math.sin(tt * 1.7 + 1)).toFixed(3);
  const look = ease(seg(tt, 18.2, 19.2));
  $('#s6head').setAttribute('transform', `rotate(${(-14 * look).toFixed(2)} 160 448) translate(${(4 * look).toFixed(1)} ${(-3 * look).toFixed(1)})`);
  cam('s6', t, 16.5, 21.0, 1.08, 1.0, -30, 0, f);
  setFreeze('s6', t, f);
}
// scene 7 quick cuts are handled in seek; scene 8 collage
let cloned = false;
function cloneScenes() {
  if (cloned) return; cloned = true;
  document.querySelectorAll('.pn').forEach((pn) => {
    const src = $('#' + pn.dataset.src + ' svg.bg').cloneNode(true);
    src.removeAttribute('class'); src.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
    pn.insertBefore(src, pn.firstChild);
  });
}
function collage(t) {
  cloneScenes();
  const pns = document.querySelectorAll('.pn');
  pns.forEach((pn, i) => {
    const a = ease(seg(t, 21.55 + i * 0.05, 21.85 + i * 0.05));
    pn.style.opacity = a.toFixed(3);
    pn.style.transform = `scale(${(1.25 - 0.25 * a).toFixed(3)})`;
  });
  $('#grid').style.transform = `rotate(-4deg) scale(${(1 + 0.03 * seg(t, 22, 27)).toFixed(4)})`;
  const n1 = Math.floor(H1.length * seg(t, 22.3, 23.3)), n2 = Math.floor(H2.length * seg(t, 23.8, 24.6));
  $('#h1').textContent = H1.slice(0, n1); $('#h2').textContent = H2.slice(0, n2);
  $('#cflash').style.opacity = (0.4 * (1 - seg(t, 21.85, 22.05)) * (t > 21.85 ? 1 : 0)).toFixed(3);
}
function endCard(t) {
  const d = (x, a, b) => (1 - ease(seg(t, a, b))).toFixed(3);
  $('#m1').setAttribute('stroke-dashoffset', d(t, 26.8, 27.3));
  $('#m2').setAttribute('stroke-dashoffset', d(t, 27.1, 27.7));
  $('#m3').setAttribute('stroke-dashoffset', d(t, 27.6, 28.0));
  const w = ease(seg(t, 27.4, 28.0));
  $('#word').style.opacity = w; $('#word').style.transform = `translateX(${(20 * (1 - w)).toFixed(1)}px)`;
  $('#tag').style.opacity = ease(seg(t, 27.9, 28.5)); $('#url').style.opacity = ease(seg(t, 28.3, 28.9));
}

window.seek = (t) => {
  // which scene is on screen (21.0–21.55: quick cuts through the freezes)
  let cur = null;
  if (t < 2.5) cur = 's1'; else if (t < 6) cur = 's2'; else if (t < 9.5) cur = 's3'; else if (t < 13) cur = 's4';
  else if (t < 16.5) cur = 's5'; else if (t < 21) cur = 's6'; else if (t < 21.55) cur = ['s2', 's3', 's4', 's5', 's6'][Math.min(4, Math.floor((t - 21) / 0.11))];
  else if (t < 26.5) cur = 'collage'; else cur = 'end';
  ['s1', 's2', 's3', 's4', 's5', 's6', 'collage', 'end'].forEach((id) => show(id, id === cur));
  // scene 1
  if (cur === 's1') {
    document.querySelectorAll('#s1lamps > g').forEach((g, i) => { g.style.opacity = seg(t, 0.5 + i * 0.32, 0.58 + i * 0.32) > 0.5 ? 1 : 0; });
    $('#s1halo').style.opacity = (0.9 * seg(t, 1.2, 2.2)).toFixed(3);
    $('#k1').style.opacity = (ease(seg(t, 0.6, 1.1)) * (1 - seg(t, 2.0, 2.45))).toFixed(3);
    cam('s1', t, 0, 2.5, 1.0, 1.08, 0, 0);
    $('#s1 .cam').style.opacity = ease(seg(t, 0, 0.6)).toFixed(3);
  }
  // keep every scene at its own clock (the quick cuts and the collage reuse their frozen state)
  const at = (id, tt) => Math.max(S[id][0], tt);
  s2(cur === 's2' ? t : S.s2[2] + 1); s3(cur === 's3' ? t : S.s3[2] + 1); s4(cur === 's4' ? t : S.s4[2] + 1);
  s5(cur === 's5' ? t : S.s5[2] + 1); s6(cur === 's6' ? t : S.s6[2] + 1);
  if (cur === 'collage') collage(t);
  if (cur === 'end') { endCard(t); $('#end').style.opacity = ease(seg(t, 26.5, 26.9)); }
};
window.ready = document.fonts.ready;
</script>
</body></html>
