# CricSynthesis platform — uv workspace
#   cricdata   Cricsheet ingest → Parquet / BigQuery
#   cricsim    simulation engine, player ratings, format rules
#   (cricapi   API on Cloud Run — added in a later phase)

[tool.uv.workspace]
members = ["cricdata", "cricsim"]

[tool.uv.sources]
cricdata = { workspace = true }
cricsim = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "hypothesis>=6.100",
]
