[project]
name = "cricsynthesis-mcp"
version = "0.2.0"
description = "CricSynthesis MCP server: cricket match forecasts, what-if simulations, fantasy picks and Pattern Lab for AI assistants"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
cricsynthesis-mcp = "cricmcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricmcp"]
