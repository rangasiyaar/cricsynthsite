[project]
name = "cricapi"
version = "0.1.0"
description = "CricSynthesis API: analytics, simulation and graphics in one catalog"
requires-python = ">=3.12"
dependencies = [
    "cricsim",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",          # TestClient
]

[project.scripts]
cricapi = "cricapi.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricapi"]
