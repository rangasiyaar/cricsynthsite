# Read-only check of whether a public page can be read by our jobs: robots.txt, the page's status and headers,
# whether its text already holds the data (or only scripts load it) and which data URLs it uses. Run by hand only.
name: Site probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to check, e.g. https://www.example.com/live-cricket-score"
        required: true
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          URL: ${{ inputs.url }}
        run: |
          origin=$(python3 -c "import sys,urllib.parse as u;p=u.urlparse(sys.argv[1]);print(f'{p.scheme}://{p.netloc}')" "$URL")
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          echo "::group::robots.txt"; curl -sS -m 20 -A "$UA" "$origin/robots.txt" | head -80; echo "::endgroup::"
          echo "::group::headers"; curl -sS -m 20 -A "$UA" -D - -o page.html "$URL" | head -40; echo "::endgroup::"
          echo "size: $(wc -c < page.html) bytes"
          python3 - <<'PY'
          import re, html
          s = open("page.html", encoding="utf-8", errors="replace").read()
          text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.S)
          text = html.unescape(re.sub(r"<[^>]+>", " ", text)); text = re.sub(r"\s+", " ", text)
          print("title:", re.search(r"<title>(.*?)</title>", s, re.S).group(1).strip() if "<title>" in s else "-")
          print("visible text sample:", text[:1500])
          print("score-like strings in text:", re.findall(r"\b\d{1,3}/\d{1,2}\b(?:\s*\(\d{1,2}(?:\.\d)?\s*(?:ov|overs?)?\))?", text)[:15])
          print("__NEXT_DATA__ / embedded JSON:", "__NEXT_DATA__" in s, "application/ld+json" in s, len(re.findall(r"<script[^>]*>\s*[\[{]", s)))
          urls = sorted(set(re.findall(r"https?://[^\s\"'<>]+", s)))
          print("data-looking URLs:", [u for u in urls if re.search(r"api|json|feed|score|graphql|ws", u, re.I)][:40])
          print("scorecard links:", sorted(set(re.findall(r'href="([^"]*(?:scorecard|live-score|match)[^"]*)"', s)))[:25])
          for k in ("copyright", "all rights reserved", "terms"):
              i = text.lower().find(k)
              if i >= 0: print(f"[{k}]", text[max(0, i - 150): i + 200])
          PY
