# Read-only check of whether a public page can be read by our jobs: robots.txt, the page's status and headers,
# whether its text already holds the data (or only scripts load it) and which data URLs it uses. Run by hand only.
name: Site probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Page to check, e.g. https://www.example.com/live-cricket-score"
        required: true
      ids:
        description: "JSON feed: also check its player ids against the Cricsheet register (cricinfo keys)"
        type: boolean
        default: false
      cricbuzz:
        description: "Cricbuzz match ids (space-separated): check their squads pages' player ids against the register instead"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.ids || inputs.cricbuzz != '' }}
      - uses: astral-sh/setup-uv@v5
        if: ${{ inputs.cricbuzz != '' }}
      - name: Cricbuzz player ids v the Cricsheet register
        if: ${{ inputs.cricbuzz != '' }}
        env:
          IDS: ${{ inputs.cricbuzz }}
        run: |
          curl -sS -m 60 -o "$RUNNER_TEMP/people.csv" https://cricsheet.org/register/people.csv
          uv run python scripts/cricbuzz_id_check.py "$RUNNER_TEMP/people.csv" $IDS
      - name: Player ids v the Cricsheet register
        if: ${{ inputs.ids && inputs.cricbuzz == '' }}
        env:
          URL: ${{ inputs.url }}
        run: |
          curl -sS -m 30 -A "Mozilla/5.0" -o "$RUNNER_TEMP/feed.json" "$URL"
          curl -sS -m 60 -o "$RUNNER_TEMP/people.csv" https://cricsheet.org/register/people.csv
          head -c 300 "$RUNNER_TEMP/people.csv"; echo
          python3 scripts/feed_id_check.py "$RUNNER_TEMP/feed.json" "$RUNNER_TEMP/people.csv"
      - if: ${{ !inputs.ids && inputs.cricbuzz == '' }}
        env:
          URL: ${{ inputs.url }}
        run: |
          origin=$(python3 -c "import sys,urllib.parse as u;p=u.urlparse(sys.argv[1]);print(f'{p.scheme}://{p.netloc}')" "$URL")
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          echo "::group::robots.txt"; curl -sS -m 20 -A "$UA" "$origin/robots.txt" | head -80; echo "::endgroup::"
          echo "::group::headers"; curl -sS -m 20 -A "$UA" -D - -o page.html "$URL" | head -40; echo "::endgroup::"
          echo "size: $(wc -c < page.html) bytes"
          python3 - <<'PY'
          import re, html
          import json, os
          s = open("page.html", encoding="utf-8", errors="replace").read()
          if os.environ["URL"].split("?")[0].endswith(".js"):     # a script: the data addresses it uses, with context
              for m in re.finditer(r"""["'`]([^"'`\s]{0,120}(?:api|json|ajax|commentary|ball|livescore|socket|wss?:|setInterval|refresh)[^"'`\s]{0,120})["'`]""", s, re.I):
                  print("path:", m.group(1), "|", s[max(0, m.start() - 120): m.end() + 120].replace("\n", " "))
              print("setInterval/setTimeout:", re.findall(r"set(?:Interval|Timeout)\([^;]{0,160}", s)[:10])
              raise SystemExit
          try:                                     # a JSON feed: show its shape and one full item
              d = json.loads(s)
              def shape(x, depth=0, key="$"):
                  pad = "  " * depth
                  if isinstance(x, dict):
                      print(f"{pad}{key}: {{{len(x)} keys}}")
                      if depth < 4:
                          for k, v in list(x.items())[:25]: shape(v, depth + 1, k)
                  elif isinstance(x, list):
                      print(f"{pad}{key}: [{len(x)} items]")
                      if x and depth < 4: shape(x[0], depth + 1, "[0]")
                  else:
                      print(f"{pad}{key}: {str(x)[:80]!r}")
              shape(d)
              print("first 4000 chars:", json.dumps(d, ensure_ascii=False)[:4000])
              raise SystemExit
          except ValueError:
              pass
          text = re.sub(r"<script.*?</script>|<style.*?</style>", " ", s, flags=re.S)
          text = html.unescape(re.sub(r"<[^>]+>", " ", text)); text = re.sub(r"\s+", " ", text)
          print("title:", re.search(r"<title>(.*?)</title>", s, re.S).group(1).strip() if "<title>" in s else "-")
          print("visible text sample:", text[:1500])
          print("score-like strings in text:", re.findall(r"\b\d{1,3}/\d{1,2}\b(?:\s*\(\d{1,2}(?:\.\d)?\s*(?:ov|overs?)?\))?", text)[:15])
          print("__NEXT_DATA__ / embedded JSON:", "__NEXT_DATA__" in s, "application/ld+json" in s, len(re.findall(r"<script[^>]*>\s*[\[{]", s)))
          urls = sorted(set(re.findall(r"https?://[^\s\"'<>]+", s)))
          for src in re.findall(r'<script[^>]+src="([^"]+)"', s): print("script src:", src)
          # scripts started by a loader (require.js data-main / require([...])): fetch them and list the data paths they call
          import urllib.request, urllib.parse
          mains = re.findall(r'data-main="([^"]+)"', s) + re.findall(r"""require\(\s*\[\s*["']([^"']+)["']""", s)
          for mod in mains[:6]:
              u = urllib.parse.urljoin(URL_ := __import__("os").environ["URL"], mod if mod.endswith(".js") else mod + ".js")
              try:
                  js = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=20).read().decode("utf-8", "replace")
              except Exception as e:
                  print("module", u, "failed:", e); continue
              paths = sorted(set(re.findall(r"""["'`]([^"'`\s]*(?:api|json|ajax|commentary|ball|scorecard|socket|wss?:)[^"'`\s]*)["'`]""", js, re.I)))
              print(f"module {u}: {len(js)} chars; data paths: {paths[:40]}")
              subs = sorted(set(re.findall(r"""["']((?:\.\./|\./|/)?(?:assets/)?scripts/[\w./-]+)["']""", js)))[:15]
              print("  loads:", subs)
          for i, body in enumerate(re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", s, re.S)):
              if len(body.strip()) < 40: continue
              hits = sorted(set(re.findall(r"""["'`](/?[\w./-]*(?:api|json|ajax|commentary|ball|score)[\w./?=&-]*)["'`]""", body, re.I)))
              print(f"inline script {i}: {len(body)} chars; paths: {hits[:20]}; start: {body.strip()[:300]!r}")
          print("data-looking URLs:", [u for u in urls if re.search(r"api|json|feed|score|graphql|ws", u, re.I)][:40])
          print("scorecard links:", sorted(set(re.findall(r'href="([^"]*(?:scorecard|live-score|match)[^"]*)"', s)))[:25])
          for k in ("copyright", "all rights reserved", "terms"):
              i = text.lower().find(k)
              if i >= 0: print(f"[{k}]", text[max(0, i - 150): i + 200])
          PY
