name: Results diagnose (temporary)
# Which daily data + model caches are still in Actions (to rebuild frozen forecasts lost on 17 Nov). Read-only.
on: workflow_dispatch
permissions: { contents: read, actions: read }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Actions caches (data + model per day)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api --paginate "repos/${{ github.repository }}/actions/caches?per_page=100" --jq '.actions_caches[] | "\(.created_at) \(.last_accessed_at) \(.size_in_bytes/1048576|floor)MB \(.key)"' | sort
