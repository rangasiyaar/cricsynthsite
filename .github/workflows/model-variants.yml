name: Model variants

# Backtests model variants side by side on the same held-out matches (one job per variant and cutoff), so a change
# to the ball model is judged against the current one before it becomes the default. Reports land in each job's
# summary and log.
on:
  push:
    branches: [claude/cricsynthesis-platform]
    paths: [".github/workflows/model-variants.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variant:
    name: ${{ matrix.variant.name }} · ${{ matrix.cutoff }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cutoff: ["2025-01-01", "2025-07-01", "2026-01-01"]
        variant:
          - { name: targets-as-published, rules: new, targets: raw, args: "--order sheet --roles --insample 400" }
          - { name: targets-derived, rules: new, targets: derived, args: "--order sheet --roles --insample 400" }
    env:
      CRICDATA_VENUE_RULES: ${{ matrix.variant.rules }}
      CRICDATA_TARGETS: ${{ matrix.variant.targets }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Day key
        id: day
        run: echo "key=parquet-${{ matrix.variant.rules }}-${{ matrix.variant.targets }}-$(date -u +%Y-%m-%d)-${{ hashFiles('cricdata/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: data/parquet
          key: ${{ steps.day.outputs.key }}
      - name: Data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv run cricdata download --kind all --dest data/raw
          uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
            --names data/raw/names.csv --out data/parquet
          uv run cricdata attributes --out data/parquet
          rm -rf data/raw
      - name: Backtest
        run: |
          uv run python -m cricsim.engine backtest --parquet data/parquet --cutoff ${{ matrix.cutoff }} --matches 800 \
            --sims 1000 ${{ matrix.variant.args }} --out data/backtest/report --memory 3GB
          cat data/backtest/report.md >> "$GITHUB_STEP_SUMMARY"
