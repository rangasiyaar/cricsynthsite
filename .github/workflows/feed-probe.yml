name: Feed probe

# One-off check of the fixtures/scorecard feed. Needs the repo secret CRICKETDATA_KEY; never prints it.
on:
  workflow_dispatch:
    inputs:
      series:
        description: "Comma-separated series names to search (blank = list upcoming matches)"
        default: ""
      squads:
        description: "Show squads for the upcoming matches of those series"
        type: boolean
        default: false
      provider:
        description: "Which feed to probe"
        type: choice
        options: [cricketdata, bigballs]
        default: cricketdata

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Probe
        env:
          CRICKETDATA_KEY: ${{ secrets.CRICKETDATA_KEY }}
          BIGBALLS_KEY: ${{ secrets.BIGBALLS_KEY }}
        run: |
          set -o pipefail
          IFS=',' read -ra TERMS <<< "${{ inputs.series }}"
          if [ "${{ inputs.provider }}" = "bigballs" ]; then
            uv run python -m cricsim.feed_probe_bigballs "${TERMS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            uv run python -m cricsim.feed_probe ${{ inputs.squads && '--squads' || '' }} "${TERMS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
