name: Reel T20I data

# One-off: simulates the 2nd T20I, India v New Zealand (Christchurch, 24 Oct), and prints the handful of numbers the
# marketing reel draws, as one JSON line in the log. Nothing is published. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Day key
        id: day
        run: echo "key=engine-$(date -u +%Y-%m-%d)-${{ hashFiles('cricsim/src/cricsim/engine/**', 'cricdata/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            data/parquet
            data/models/latest
          key: ${{ steps.day.outputs.key }}
      - name: Data
        run: |
          if [ ! -d data/parquet ]; then
            uv run cricdata download --kind all --dest data/raw
            uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
              --names data/raw/names.csv --out data/parquet
            uv run cricdata attributes --out data/parquet
            rm -rf data/raw
          fi
      - name: Fit
        run: |
          if [ ! -d data/models/latest ]; then
            uv run python -m cricsim.engine fit --parquet data/parquet --out data/models/latest --memory 3GB > /dev/null
          fi
      - name: Simulate
        run: |
          f=cricsim/fixtures/nz-v-ind-t20i-christchurch-2026-10-24.json
          uv run python -m cricsim.resolve --parquet data/parquet --fixture "$f" --out "data/coverage/matches/$(basename "$f")"
          uv run python -m cricsim.publish --model data/models/latest --coverage data/coverage --out data/publish --n 20000
          python3 - <<'PY'
          import json
          d = json.load(open("data/publish/matches/nz-v-ind-t20i-christchurch-2026-10-24.json"))
          s = d["summary"]; T = s["teams"]
          out = {
            "teams": [t["name"] for t in T],
            "win": [s["result"]["win"][t["name"]] for t in T],
            "score": [round(t["batting"]["score"]["mean"]) for t in T],
            "range": [[t["batting"]["score"]["q"]["10"], t["batting"]["score"]["q"]["90"]] for t in T],
            "lk": [[t["batting"]["score"]["q"]["25"], t["batting"]["score"]["q"]["75"]] for t in T],
            "med": [t["batting"]["score"]["q"]["50"] for t in T],
            "runs": [o["runs"] for o in T[0]["batting"]["per_over"]],
            "runs2": [o["runs"] for o in T[1]["batting"]["per_over"]],
            "pw": [o["p_wicket"] for o in T[0]["batting"]["per_over"]],
            "pw2": [o["p_wicket"] for o in T[1]["batting"]["per_over"]],
            "fow": [w["by_over"] for w in T[0]["batting"]["fall_of_wickets"][:5]],
            "phases": [[p["phase"], p["overs"], p["runs"]["mean"]] for p in T[0]["batting"]["phases"]],
          }
          nm = {p["id"]: p["name"] for t in T for p in t["players"]}
          print("DUELS " + json.dumps([[nm.get(m["batter"]), nm.get(m["bowler"]), m["p"]] for m in s["matchups"][:8]]))
          print("INSIGHTS " + json.dumps([i["text"] for i in d["insights"]]))
          print("REELDATA " + json.dumps(out, separators=(",", ":")))
          PY
