name: Data freshness

# How current the Cricsheet archive is: newest match overall and by type, and recent match counts.
on:
  workflow_dispatch:
  push:
    branches: [claude/cricsynthesis-platform]
    paths: ["cricdata/src/cricdata/freshness.py", ".github/workflows/data-freshness.yml"]

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Freshness
        run: |
          set -o pipefail
          uv run cricdata download --kind all --dest data/raw
          uv run python -m cricdata.freshness data/raw/all_json.zip | tee -a "$GITHUB_STEP_SUMMARY"
