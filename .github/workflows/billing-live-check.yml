name: Check Razorpay keys

# Read-only: which mode the Razorpay keys in GitHub secrets are, that Razorpay accepts them, the plans on the account,
# and whether the webhook secret and promo offers are set (master/scripts/check-live.ts). Creates and charges nothing.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check
        working-directory: master
        env:
          GOOGLE_SA: ${{ secrets.FIRESTORE_SA_KEY }}
          RZP_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RZP_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RZP_WEBHOOK: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RZP_OFFER_WELCOME100: ${{ secrets.RAZORPAY_OFFER_WELCOME100 }}
        run: node --experimental-strip-types --no-warnings scripts/check-live.ts | tee -a "$GITHUB_STEP_SUMMARY"
