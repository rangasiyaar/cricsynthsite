name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import json, re, time, requests
          from playwright.sync_api import sync_playwright
          BASE = "https://www.cricketworld.com"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          head = lambda s, n=900: re.sub(r"\s+", " ", s)[:n]
          for path in ("/robots.txt", "/terms-of-use", "/terms", "/cricket/live"):
              try:
                  r = requests.get(BASE + path, headers={"User-Agent": UA}, timeout=30)
                  print(f"=== GET {path}: {r.status_code} {len(r.text)} bytes {r.headers.get('content-type')} server={r.headers.get('server')} cf-mitigated={r.headers.get('cf-mitigated')}")
                  if path == "/robots.txt": print(head(r.text, 2500))
                  elif path == "/cricket/live": print("plain HTML text:", head(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", r.text, flags=re.S), 1500))
                  else: print("   ", head(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", r.text, flags=re.S), 700))
              except Exception as e: print(f"=== GET {path}: ERROR {e}")
          with sync_playwright() as p:
              b = p.chromium.launch()
              def grab(url, wait=15):
                  pg = b.new_page(user_agent=UA); log = []
                  def on_resp(r):
                      try:
                          if r.request.resource_type in ("xhr", "fetch", "document") or "json" in r.headers.get("content-type", ""):
                              ct = r.headers.get("content-type", ""); body = r.text() if ("json" in ct) else ""
                              log.append(("RES", r.status, r.url, ct[:30], len(body), body[:600]))
                      except Exception: pass
                  pg.on("response", on_resp)
                  pg.on("requestfailed", lambda r: log.append(("FAIL", r.failure, r.url, "", 0, "")))
                  pg.on("websocket", lambda w: log.append(("WS", "", w.url, "", 0, "")))
                  t0 = time.time(); pg.goto(url, wait_until="domcontentloaded", timeout=60000); pg.wait_for_timeout(wait * 1000)
                  print(f"\n##### {url} title={pg.title()!r} {time.time()-t0:.1f}s")
                  print("visible text:", head(pg.inner_text("body"), 2500))
                  for e in log:
                      if not re.search(r"(google|doubleclick|facebook|criteo|amazon-adsystem|adnxs|pubmatic|rubicon|taboola|outbrain|\.css|\.woff|\.png|\.jpg|\.webp|\.svg)", e[2]):
                          print(" ", e[0], e[1], e[2][:170], e[3], f"{e[4]}B", ("keys=" + str(list(json.loads(e[5]).keys())[:12]) if e[5].startswith("{") and e[4] < 600 else ""))
                  links = pg.eval_on_selector_all("a[href]", "els => els.map(e => e.href)"); pg.close(); return links
              links = grab(BASE + "/cricket/live")
              match = [l for l in dict.fromkeys(links) if "cricketworld.com" in l and re.search(r"/(scorecard|live-score|match|cricket/live/)", l)]
              print("\nmatch links:", len(match)); [print("  ", l) for l in match[:15]]
              for l in match[:2]: grab(l, 15)
              b.close()
          PY
          python probe.py
