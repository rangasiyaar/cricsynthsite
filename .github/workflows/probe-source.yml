name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import json, re, time, requests
          from urllib.parse import urljoin
          from playwright.sync_api import sync_playwright
          BASE = "https://www.heroliveline.com"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          def head(s, n=600): return re.sub(r"\s+", " ", s)[:n]
          for path in ("/robots.txt", "/terms", "/terms-and-conditions", "/fixtures"):
              try:
                  r = requests.get(BASE + path, headers={"User-Agent": UA}, timeout=30)
                  print(f"=== GET {path}: {r.status_code} {len(r.text)} bytes, {r.headers.get('content-type')}, server={r.headers.get('server')}, cf={r.headers.get('cf-ray') is not None}")
                  if path == "/robots.txt" or r.status_code != 200: print(head(r.text, 1500))
                  if path == "/fixtures":
                      t = r.text
                      print("next_data:", "__NEXT_DATA__" in t, "| nuxt:", "__NUXT__" in t, "| plain text sample:", head(re.sub(r"<[^>]+>", " ", t), 500))
              except Exception as e:
                  print(f"=== GET {path}: ERROR {e}")
          seen = {}
          def grab(page, url, wait=12):
              calls = []
              def on_resp(resp):
                  try:
                      ct = resp.headers.get("content-type", "")
                      if resp.request.resource_type in ("xhr", "fetch") or "json" in ct:
                          body = resp.text() if ("json" in ct or "text" in ct) else ""
                          calls.append((resp.status, resp.request.method, resp.url, ct, body))
                  except Exception: pass
              ws = []
              page.on("response", on_resp)
              page.on("websocket", lambda w: ws.append(w.url))
              t0 = time.time(); page.goto(url, wait_until="domcontentloaded", timeout=60000); page.wait_for_timeout(wait * 1000)
              print(f"\n##### {url}  title={page.title()!r}  load {time.time()-t0:.1f}s")
              print("visible text:", head(page.inner_text("body"), 1200))
              for st, m, u, ct, body in calls:
                  keys = ""
                  try:
                      j = json.loads(body); keys = list(j.keys())[:15] if isinstance(j, dict) else f"list[{len(j)}]"
                  except Exception: pass
                  print(f"  {st} {m} {u[:160]} [{ct[:30]}] {len(body)}B keys={keys}")
                  seen.setdefault(u.split('?')[0], body[:1500])
              for w in ws: print("  WEBSOCKET", w)
              links = page.eval_on_selector_all("a[href]", "els => els.map(e => e.href)")
              return links
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(user_agent=UA)
              links = grab(pg, BASE + "/fixtures")
              match = [l for l in dict.fromkeys(links) if re.search(r"/(match|live|scorecard|score)", l, re.I) and "heroliveline" in l]
              print("\nmatch-like links:", len(match)); [print("  ", l) for l in match[:15]]
              for l in match[:2]:
                  grab(b.new_page(user_agent=UA), l, 15)
              b.close()
          print("\n===== sample bodies of data endpoints =====")
          for u, body in list(seen.items())[:8]:
              print("--", u[:160]); print(head(body, 900))
          PY
          python probe.py
