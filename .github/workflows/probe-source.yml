name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import re, time, requests
          from playwright.sync_api import sync_playwright
          BASE = "https://www.heroliveline.com"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          head = lambda s, n=700: re.sub(r"\s+", " ", s)[:n]
          html = requests.get(BASE + "/fixtures", headers={"User-Agent": UA}, timeout=30).text
          js = [BASE + j if j.startswith("/") else j for j in re.findall(r'src="([^"]+\.js)"', html)]
          print("bundles:", js)
          hosts = set()
          for j in js:
              t = requests.get(j, headers={"User-Agent": UA}, timeout=60).text
              print(f"-- {j} {len(t)} bytes")
              for u in sorted(set(re.findall(r'https?://[a-zA-Z0-9.-]+(?:/[a-zA-Z0-9_./-]*)?', t))):
                  if not re.search(r"(w3\.org|reactjs|googletagmanager|google-analytics|facebook|apple\.com|play\.google|mozilla|github)", u):
                      hosts.add(u)
              for k in ("socket", "firebase", "apiKey", "baseURL", "Authorization", "x-api-key", "token", "liveline", "cricket"):
                  for m in list(re.finditer(k, t))[:3]:
                      print(f"   [{k}] ...{head(t[max(0,m.start()-120):m.end()+160], 300)}...")
          print("URLs in bundles:"); [print("  ", h) for h in sorted(hosts)[:80]]
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(user_agent=UA, locale="en-IN", timezone_id="Asia/Kolkata")
              log = []
              pg.on("request", lambda r: log.append(("REQ", r.resource_type, r.method, r.url)))
              pg.on("requestfailed", lambda r: log.append(("FAIL", r.resource_type, r.failure, r.url)))
              pg.on("response", lambda r: log.append(("RES", r.request.resource_type, r.status, r.url)))
              pg.on("websocket", lambda w: log.append(("WS", "", "", w.url)))
              pg.on("console", lambda m: log.append(("CONSOLE", m.type, "", m.text[:200])))
              pg.goto(BASE + "/fixtures", wait_until="networkidle", timeout=90000); pg.wait_for_timeout(25000)
              print("\nvisible text:", head(pg.inner_text("body"), 1500))
              for e in log:
                  if not re.search(r"(google-analytics|googletagmanager|\.css|\.woff|\.png|\.svg|\.jpg|\.webp)", str(e[3])):
                      print(" ", *[str(x)[:170] for x in e])
              b.close()
          PY
          python probe.py
