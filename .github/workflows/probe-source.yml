name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import re, requests, urllib.robotparser
          BASE = "https://possible11.com"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          S = requests.Session(); S.headers["User-Agent"] = UA
          rp = urllib.robotparser.RobotFileParser(); rp.parse(S.get(BASE + "/robots.txt", timeout=30).text.splitlines())
          head = lambda s, n=900: re.sub(r"\s+", " ", s)[:n]
          text = lambda h: re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", h, flags=re.S)
          def get(u):
              if not rp.can_fetch("*", u): print("robots disallow", u); return ""
              r = S.get(u, timeout=30); print(f"--- {r.status_code} {len(r.text)}B {u}"); return r.text
          KEYS = ("Playing XI", "Playing 11", "Probable", "Squad", "won the toss", "elected to", "Impact")
          def look(u, keys=KEYS, n=700):
              t = text(get(u))
              for k in keys:
                  for m in list(re.finditer(k, t))[:2]:
                      print(f"   [{k}] ...{head(t[max(0,m.start()-60):m.end()+n], n+60)}")
              return t
          for u in ("/live-score/ben-vs-chn-21100/", "/live-score/guj-vs-mum-21096/", "/live-score/nag-vs-man-21057/", "/live-score/vct-vs-wau-19305/"):
              look(BASE + u, ("Squad",), 500)
          # finished matches: the scorecard section and any confirmed XI
          for u in ("/live-score/pka-vs-kmg-20636/", "/live-score/nz-vs-ind-17892/"):
              t = look(BASE + u, ("Playing XI", "Playing 11", "won the toss", "elected to", "Did not bat", "Yet to bat", "Bench", "Impact"), 500)
              i = t.find("Scorecard"); print("   scorecard area:", head(t[i:i+1500], 1500) if i >= 0 else "none")
          PY
          python probe.py
