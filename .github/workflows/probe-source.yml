name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import json, re, time, requests
          from playwright.sync_api import sync_playwright
          BASE = "https://www.perfectlineup.in"
          URL = BASE + "/match-tips-predictions/nsw-vs-sa-dream11-prediction-13th-match-one-day-16-nov-2026-australia-domestic-one-day-cup/98770/37231/1"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          head = lambda s, n=900: re.sub(r"\s+", " ", s)[:n]
          strip = lambda h: re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", h, flags=re.S)
          for path in ("/robots.txt", "/terms", "/terms-and-conditions", "/terms-of-use"):
              try:
                  r = requests.get(BASE + path, headers={"User-Agent": UA}, timeout=30)
                  print(f"=== GET {path}: {r.status_code} {len(r.text)}B {r.headers.get('content-type')} server={r.headers.get('server')}")
                  print("   ", head(r.text if path == "/robots.txt" else strip(r.text), 1800 if path == "/robots.txt" else 1200))
              except Exception as e: print(f"=== GET {path}: ERROR {e}")
          r = requests.get(URL, headers={"User-Agent": UA}, timeout=30)
          print(f"=== GET match page: {r.status_code} {len(r.text)}B server={r.headers.get('server')} next_data={'__NEXT_DATA__' in r.text} nuxt={'__NUXT__' in r.text} ld+json={r.text.count('application/ld+json')}")
          t = strip(r.text); print("plain text length", len(t))
          for k in ("Playing XI", "Playing 11", "Probable", "Lineup", "Line-up", "Toss", "Pitch", "Captain", "Squad", "Team News", "Injury"):
              for m in list(re.finditer(k, t, re.I))[:2]:
                  print(f"   [{k}] ...{head(t[max(0,m.start()-100):m.end()+400], 500)}")
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page(user_agent=UA); log = []
              def on_resp(x):
                  try:
                      ct = x.headers.get("content-type", "")
                      if x.request.resource_type in ("xhr", "fetch") or "json" in ct:
                          body = x.text() if "json" in ct else ""
                          log.append((x.status, x.url, ct[:30], len(body), body[:300]))
                  except Exception: pass
              pg.on("response", on_resp)
              pg.goto(URL, wait_until="domcontentloaded", timeout=60000); pg.wait_for_timeout(15000)
              vt = pg.inner_text("body")
              print(f"\n##### rendered: title={pg.title()!r} {len(vt)} chars")
              print("rendered text:", head(vt, 4000))
              for e in log:
                  if not re.search(r"(google|doubleclick|facebook|criteo|adnxs|pubmatic|taboola|outbrain|clarity|hotjar)", e[1]):
                      print("  ", e[0], e[1][:170], e[2], f"{e[3]}B", head(e[4], 200))
              b.close()
          PY
          python probe.py
