name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q requests
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import re, sys, requests, urllib.robotparser
          BASE = "https://possible11.com"
          URL = BASE + "/live-score/falk-vs-cor-20971/"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          head = lambda s, n=900: re.sub(r"\s+", " ", s)[:n]
          r = requests.get(BASE + "/robots.txt", headers={"User-Agent": UA}, timeout=30)
          print(f"=== robots.txt: {r.status_code}\n{r.text[:2500]}")
          rp = urllib.robotparser.RobotFileParser(); rp.parse(r.text.splitlines() if r.status_code == 200 else [])
          ok = rp.can_fetch("*", URL) and rp.can_fetch(UA, URL)
          print("robots allow the match page for generic bots:", ok)
          if not ok: sys.exit(0)
          r = requests.get(URL, headers={"User-Agent": UA}, timeout=30); h = r.text
          print(f"=== match page: {r.status_code} {len(h)}B server={r.headers.get('server')} cf-mitigated={r.headers.get('cf-mitigated')} next_data={'__NEXT_DATA__' in h}")
          print("text:", head(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", h, flags=re.S), 1500))
          for pat in (r"espncricinfo\.com[^\"'\s<>]*", r"cricinfo[^\"'\s<>]{0,80}", r"[\"'](?:objectId|object_id|cricinfo_?id|ci_?id|espn_?id|cid)[\"']\s*:\s*[\"']?\d+", r"cricsheet[^\"'\s<>]{0,80}"):
              found = sorted(set(re.findall(pat, h, re.I)))
              print(f"[{pat}] {len(found)} hits"); [print("   ", f[:200]) for f in found[:25]]
          players = sorted(set(re.findall(r'href="(/[^"]*(?:player|profile)[^"]*)"', h, re.I)))
          print("player links:", len(players)); [print("   ", p) for p in players[:10]]
          ids = sorted(set(re.findall(r'"(?:id|player_id|pid|match_id|mid)"\s*:\s*"?(\d+)', h)))[:20]
          print("generic numeric ids in page data:", ids)
          if players:
              pu = BASE + players[0]
              if rp.can_fetch("*", pu):
                  p = requests.get(pu, headers={"User-Agent": UA}, timeout=30).text
                  print(f"=== player page {pu}: {len(p)}B")
                  for pat in (r"espncricinfo\.com[^\"'\s<>]*", r"cricinfo[^\"'\s<>]{0,80}", r"[\"'](?:objectId|cricinfo_?id|espn_?id)[\"']\s*:\s*[\"']?\d+"):
                      found = sorted(set(re.findall(pat, p, re.I))); print(f"[{pat}] {len(found)}"); [print("   ", f[:200]) for f in found[:10]]
          PY
          python probe.py
