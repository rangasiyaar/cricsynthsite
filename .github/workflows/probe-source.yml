name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import json, re, time, requests
          from playwright.sync_api import sync_playwright
          BASE = "https://www.cricketworld.com"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          head = lambda s, n=900: re.sub(r"\s+", " ", s)[:n]
          for path in ("/robots.txt", "/terms-of-use", "/terms", "/cricket/live"):
              try:
                  r = requests.get(BASE + path, headers={"User-Agent": UA}, timeout=30)
                  print(f"=== GET {path}: {r.status_code} {len(r.text)} bytes {r.headers.get('content-type')} server={r.headers.get('server')} cf-mitigated={r.headers.get('cf-mitigated')}")
                  if path == "/robots.txt": print(head(r.text, 2500))
                  elif path == "/cricket/live": print("plain HTML text:", head(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", r.text, flags=re.S), 1500))
                  else: print("   ", head(re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", r.text, flags=re.S), 700))
              except Exception as e: print(f"=== GET {path}: ERROR {e}")
          with sync_playwright() as p:
              b = p.chromium.launch()
              def text(url, wait=12):
                  pg = b.new_page(user_agent=UA); t0 = time.time()
                  pg.goto(url, wait_until="domcontentloaded", timeout=60000); pg.wait_for_timeout(wait * 1000)
                  t = pg.inner_text("body"); links = pg.eval_on_selector_all("a[href]", "els => els.map(e => e.href)"); pg.close()
                  print(f"\n##### {url} ({time.time()-t0:.0f}s, {len(t)} chars)")
                  return t, links
              t, links = text(BASE + "/cricket/live")
              results = [l for l in dict.fromkeys(links) if re.search(r"/match/(result|scorecard|live)/", l)]
              print("all match links on the live page:", len(results))
              for l in results[:40]: print("  ", l)
              i = t.find("Live Matc"); print("after the strip:", head(t[i:i+3000] if i >= 0 else t[-3000:], 3000))
              # a recent finished WBBL match and the first live match
              cand = [l for l in results if "women" in l][:1] + results[:1]
              for l in cand:
                  for suffix in ("", "?tab=scorecard"):
                      t2, _ = text(l + suffix)
                      for k in ("Playing XI", "Playing 11", "Toss", "won the toss", "elected", "Scorecard", "Fall of", "Did not bat", "Bench", "Squad"):
                          j = t2.find(k)
                          if j >= 0: print(f"   [{k}] ...{head(t2[max(0,j-150):j+450], 600)}")
              # one finished limited-overs match via its series page
              t3, l3 = text(BASE + "/cricket/series")
              wbbl = [l for l in dict.fromkeys(l3) if "big-bash" in l.lower() and "women" in l.lower()][:1]
              print("WBBL series link:", wbbl)
              if wbbl:
                  t4, l4 = text(wbbl[0])
                  done = [l for l in dict.fromkeys(l4) if "/match/" in l][:3]; print("WBBL match links:", done)
                  for l in done[:1]:
                      t5, _ = text(l)
                      for k in ("Playing XI", "Toss", "won the toss", "elected", "Did not bat", "Fall of", "Result", "won by"):
                          j = t5.find(k)
                          if j >= 0: print(f"   [{k}] ...{head(t5[max(0,j-150):j+450], 600)}")
              b.close()
          PY
          python probe.py
