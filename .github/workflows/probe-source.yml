name: Probe source
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q playwright requests && python -m playwright install --with-deps chromium > /dev/null
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import re, sys, requests, urllib.robotparser
          from playwright.sync_api import sync_playwright
          BASE = "https://www.cricketnmore.com"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          S = requests.Session(); S.headers["User-Agent"] = UA
          head = lambda s, n=900: re.sub(r"\s+", " ", s)[:n]
          text = lambda h: re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", h, flags=re.S)
          r = S.get(BASE + "/robots.txt", timeout=30); print(f"=== robots.txt {r.status_code}\n{r.text[:2000]}")
          rp = urllib.robotparser.RobotFileParser(); rp.parse(r.text.splitlines() if r.status_code == 200 else [])
          LIVE = BASE + "/live-cricket-score"
          if not rp.can_fetch("*", LIVE): print("robots disallow the live page: stop"); sys.exit(0)
          pw = sync_playwright().start(); br = pw.chromium.launch()
          def page(u):
              if not rp.can_fetch("*", u): print("robots disallow", u); return "", []
              h = S.get(u, timeout=30); t = text(h.text)
              links = re.findall(r'href="([^"]+)"', h.text)
              print(f"--- {h.status_code} {len(h.text)}B text {len(t.strip())} {u} server={h.headers.get('server')} cf-mitigated={h.headers.get('cf-mitigated')}")
              if len(t.strip()) < 3000:
                  pg = br.new_page(user_agent=UA); pg.goto(u, wait_until="domcontentloaded", timeout=60000); pg.wait_for_timeout(10000)
                  t = pg.inner_text("body"); links = pg.eval_on_selector_all("a[href]", "els => els.map(e => e.href)"); pg.close()
                  print(f"    rendered: {len(t)} chars")
              return t, [l if l.startswith("http") else BASE + l for l in links]
          t, links = page(LIVE)
          print("live text:", head(t, 2500))
          ml = [l for l in dict.fromkeys(links) if "cricketnmore.com" in l and re.search(r"(scorecard|live-score|match|commentary)", l, re.I) and l.rstrip("/") != LIVE]
          print("match links:", len(ml)); [print("  ", l) for l in ml[:30]]
          KEYS = ("Playing XI", "Playing 11", "Playing11", "Squad", "won the toss", "elected to", "Toss", "Yet to bat", "Did not bat", "Impact")
          for u in ml[:6]:
              t2, l2 = page(u)
              for k in KEYS:
                  for m in list(re.finditer(k, t2, re.I))[:1]:
                      print(f"   [{k}] ...{head(t2[max(0,m.start()-80):m.end()+500], 580)}")
              tabs = [l for l in dict.fromkeys(l2) if re.search(r"(squad|playing|scorecard)", l, re.I) and "cricketnmore.com" in l][:3]
              print("   tabs:", tabs)
              for tb in tabs[:2]:
                  t3, _ = page(tb)
                  for k in KEYS:
                      for m in list(re.finditer(k, t3, re.I))[:1]:
                          print(f"      [{k}] ...{head(t3[max(0,m.start()-80):m.end()+600], 680)}")
          br.close(); pw.stop()
          PY
          python probe.py
