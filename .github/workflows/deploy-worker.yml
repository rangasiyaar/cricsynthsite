name: Deploy Worker

# The hosted API on Cloudflare Workers (free plan, see infra/EDGE_PLAN.md): tests, then `wrangler deploy`.
# Deploys only once the repo secrets CLOUDFLARE_API_TOKEN (Workers edit, this account only) and CLOUDFLARE_ACCOUNT_ID
# are set; until then it just runs the tests. FIRESTORE_SA_KEY (a service-account JSON key that can read
# users/*/keys and write users/*/usage) turns on dashboard API keys; it's copied to the Worker as the GOOGLE_SA secret.
on:
  workflow_dispatch:
  push:
    branches: [claude/cricsynthesis-platform]
    paths: ["edge/**", "cricmcp/src/cricmcp/insight.py", "cricmcp/src/cricmcp/graphics.py", ".github/workflows/deploy-worker.yml"]

permissions:
  contents: read

concurrency: { group: deploy-worker, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      HAS_SA: ${{ secrets.FIRESTORE_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: edge/package-lock.json }
      - uses: astral-sh/setup-uv@v5
      - name: Tests (Worker, and its parity with the MCP server's Python)
        run: |
          (cd edge && npm ci && npx tsc --noEmit && npm test)
          uv sync --all-extras && uv run pytest cricmcp/tests/test_edge_parity.py -q
      - uses: actions/cache/restore@v4               # the prepared answers (edge-data.yml), so a code deploy keeps them
        with:
          path: edge/assets/edge
          key: edge-assets-${{ github.run_id }}
          restore-keys: edge-assets-
      - name: Deploy
        if: env.HAS_CF == 'true'
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dashboard keys (Firestore service account → Worker secret)
        if: env.HAS_CF == 'true' && env.HAS_SA == 'true'
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA: ${{ secrets.FIRESTORE_SA_KEY }}
        run: printf '%s' "$SA" | npx wrangler secret put GOOGLE_SA
      - name: Razorpay keys (CricSynthesis Pro checkout → Worker secrets; test keys until launch)
        if: env.HAS_CF == 'true'
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RZP_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RZP_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RZP_WEBHOOK: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          RESEND: ${{ secrets.RESEND_API_KEY }}
          TS_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          TS_SITE: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          # bot check on the public forms (turnstile.ts): only with both keys, so the site always shows the widget the API asks for
          if [ -n "$TS_SECRET" ] && [ -n "$TS_SITE" ]; then node -e 'process.stdout.write(JSON.stringify({TURNSTILE_SECRET: process.env.TS_SECRET}))' > /tmp/ts.json && npx wrangler secret bulk /tmp/ts.json; rm -f /tmp/ts.json; echo "Form bot check: on" >> "$GITHUB_STEP_SUMMARY"
          else npx wrangler secret delete TURNSTILE_SECRET --force >/dev/null 2>&1 || true; echo "::notice::No TURNSTILE_SECRET / TURNSTILE_SITE_KEY: the form bot check is off."; fi
          # account emails (emails.ts): set whenever the secret exists, independent of the payment keys
          if [ -n "$RESEND" ]; then node -e 'process.stdout.write(JSON.stringify({RESEND_API_KEY: process.env.RESEND}))' > /tmp/rs.json && npx wrangler secret bulk /tmp/rs.json; rm -f /tmp/rs.json; echo "Account emails: on" >> "$GITHUB_STEP_SUMMARY"; else echo "::notice::No RESEND_API_KEY: account emails are off."; fi
          [ -n "$RZP_ID" ] && [ -n "$RZP_SECRET" ] || { echo "::notice::No Razorpay keys yet: checkout stays off."; exit 0; }
          node -e 'const e=process.env, o={RAZORPAY_KEY_ID:e.RZP_ID, RAZORPAY_KEY_SECRET:e.RZP_SECRET}; if (e.RZP_WEBHOOK) o.RAZORPAY_WEBHOOK_SECRET=e.RZP_WEBHOOK; process.stdout.write(JSON.stringify(o))' > /tmp/rzp.json
          npx wrangler secret bulk /tmp/rzp.json
          rm -f /tmp/rzp.json
          case "$RZP_ID" in rzp_live_*) echo "Razorpay: live keys";; *) echo "Razorpay: test keys";; esac >> "$GITHUB_STEP_SUMMARY"
      - name: Not deployed
        if: env.HAS_CF != 'true'
        run: echo "::notice::Tests passed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy."
