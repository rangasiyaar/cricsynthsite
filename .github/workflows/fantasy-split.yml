name: Fantasy split

# Fantasy XI by win chance (the favourite's share of the 11 = its win %, C/VC from the favourite) against the live
# single XI. Default: the latest 200 matches in the dataset, T20-type and one-day, model trained only on the
# matches before them (engine backtest). `published`: the site's scored results instead.
on:
  workflow_dispatch:
    inputs:
      matches: { description: "Latest N matches per format family", default: "200" }
      published: { description: "Check the site's scored results instead", type: boolean, default: false }

permissions:
  contents: read

jobs:
  published:
    if: ${{ inputs.published }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run python -m cricsim.fantasy_split
  backtest:
    if: ${{ !inputs.published }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: T20
            args: ""
          - family: OD
            args: --latest-format OD
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Day key
        id: day
        run: echo "key=parquet-$(date -u +%Y-%m-%d)-${{ hashFiles('cricdata/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: data/parquet
          key: ${{ steps.day.outputs.key }}
      - name: Data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv run cricdata download --kind all --dest data/raw
          uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
            --names data/raw/names.csv --out data/parquet
          uv run cricdata attributes --out data/parquet
          rm -rf data/raw
      - name: Backtest
        env: { N: "${{ inputs.matches || 200 }}" }
        run: |
          uv run python -m cricsim.engine backtest --parquet data/parquet --latest "$N" ${{ matrix.args }} --sims 1000 \
            --fielding both --out data/lab/${{ matrix.family }} --memory 3GB > /dev/null
      - name: Fantasy results
        run: |
          python3 - data/lab/${{ matrix.family }}.json <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          fz = json.load(open(sys.argv[1]))["fantasy"]
          print(f"## {sys.argv[1]}: {fz['n']} matches, best possible XI {fz['best_possible']} points\n")
          print("| Strategy | Avg points | Share of best |\n|---|---|---|")
          for k in ("mean", "win_split", "win_split_cv_overall", "cap_favoured_side", "oracle_captain"):
              if k in fz["strategies"]:
                  v = fz["strategies"][k]; print(f"| {k} | {v['points']} | {100 * v['share_of_best']:.1f}% |")
          print("\n| v live XI | Points a match (95% range) | Better / worse |\n|---|---|---|")
          for k in ("win_split", "win_split_cv_overall"):
              v = fz["captain_rules_v_live"].get(k)
              if v: print(f"| {k} | {v['diff']:+.1f} ({v['lo']:+.1f} to {v['hi']:+.1f}) | {v['better']} / {v['worse']} of {v['n']} |")
          print("\n| | Matches | Live | Win-% split |\n|---|---|---|---|")
          for k, v in fz.get("win_split_by_result", {}).items():
              print(f"| {k} | {v['n']} | {v['live']} | {v['win_split']} |")
          PY
