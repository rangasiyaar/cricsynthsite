name: Engine (fit + backtest)

# Fits the simulation model on the full Cricsheet archive and backtests it on matches the model
# never saw. The backtest report lands in the job summary; the fitted model is an artifact.
on:
  workflow_dispatch:
    inputs:
      cutoff: { description: "Backtest: train before this date", default: "2025-01-01" }
      matches: { description: "Backtest matches", default: "800" }
  push:
    branches: [claude/cricsynthesis-platform]
    paths: ["cricsim/src/cricsim/**", "cricsim/demo/**", "app/**", ".github/workflows/engine.yml"]

permissions:
  contents: read

concurrency: { group: engine, cancel-in-progress: false }   # queue: never throw away a running backtest

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CUTOFF: ${{ inputs.cutoff || '2025-01-01' }}
      MATCHES: ${{ inputs.matches || '800' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest cricsim/tests cricdata/tests -q
      - name: Data
        run: |
          uv run cricdata download --kind all --dest data/raw
          uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
            --names data/raw/names.csv --out data/parquet
          uv run cricdata attributes --out data/parquet
          rm data/raw/all_json.zip
      - name: Backtest
        run: |
          uv run python -m cricsim.engine backtest --parquet data/parquet --cutoff "$CUTOFF" \
            --matches "$MATCHES" --insample 300 --sims 1000 --out data/backtest/report --memory 3GB
      - name: Fit production model (all data)
        run: uv run python -m cricsim.engine fit --parquet data/parquet --out data/models/latest --memory 3GB
      - name: Pattern Lab + demo match centre
        run: |
          uv run python -m cricsim.patterns --parquet data/parquet --out data/patterns/report --memory 3GB > /dev/null
          uv run python -m cricsim.publish --model data/models/latest --coverage cricsim/demo/coverage \
            --out data/publish --n 20000
          cp data/patterns/report.json data/publish/patterns.json
          uv run python - <<'PY'
          import json, glob
          for f in glob.glob("data/publish/matches/*.json"):
              if f.endswith(".pack.json"):
                  continue
              d = json.load(open(f))
              print("##", d["match"]["title"], d["summary"]["result"]["win"])
              for i in d["insights"]:
                  print("-", i["text"])
              for t in d["summary"]["teams"]:
                  for p in t["players"]:
                      b, w = p.get("batting") or {}, p.get("bowling") or {}
                      print(f"  {t['name']:10} {p['name']:22} known={p['known']} runs={b.get('runs',{}).get('mean')} "
                            f"p30={b.get('p_at_least',{}).get('30')} wk={w.get('wickets',{}).get('mean') if w.get('p_bowls',0)>0.5 else '-'} "
                            f"faced={p['profile'].get('balls_faced')}")
          PY
      - name: Build app with the published data
        run: |
          cd app && npm ci && cp -r ../data/publish public/data && npx tsc --noEmit && npm test && npx next build
      - name: Publish
        if: always()
        run: |
          [ -f data/backtest/report.md ] && cat data/backtest/report.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine
          path: |
            data/backtest/
            data/models/latest/
            data/publish/
            app/out/
          if-no-files-found: ignore
          retention-days: 14
