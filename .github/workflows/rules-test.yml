name: Firestore rules test (on demand)
# Runs infra/rules-tests against infra/firestore.rules with the Firebase Rules API; read-only (does not release).
on: workflow_dispatch
permissions: { contents: read, id-token: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: python3 infra/rules-tests/run.py --project "${{ secrets.GCP_PROJECT_ID }}"
