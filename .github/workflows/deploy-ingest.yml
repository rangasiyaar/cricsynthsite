name: Deploy ingest job

on:
  workflow_dispatch:
  push:
    branches: [claude/cricsynthesis-platform, main]
    paths: ["cricdata/**", "infra/deploy-ingest.sh", "infra/limits.env", ".github/workflows/deploy-ingest.yml"]

permissions:
  contents: read
  id-token: write          # keyless auth to Google Cloud (Workload Identity Federation)

concurrency: { group: deploy-ingest, cancel-in-progress: true }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras && uv run pytest cricdata/tests infra/billing_guard -q

  deploy:
    needs: test
    if: ${{ vars.GCP_ENABLED == 'true' }}     # set this repo variable once infra/bootstrap.sh has run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push image
        env:
          IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cricsynthesis/cricdata:${{ github.sha }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build -f cricdata/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy job + weekly schedule
        run: ./infra/deploy-ingest.sh "${{ secrets.GCP_PROJECT_ID }}" "$IMAGE"
