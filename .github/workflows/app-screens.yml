# Phone screenshots of the live app screens for marketing, saved to marketing/app-screens. Run by hand only.
name: App screenshots
on: workflow_dispatch
permissions:
  contents: write
concurrency: { group: app-screens, cancel-in-progress: true }
jobs:
  shoot:
    runs-on: ubuntu-24.04            # Playwright has no browser build for newer images yet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/app_screens.mjs https://cricsynthesis.in marketing/app-screens
      - name: Save
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/app-screens
          git commit -qm "App screenshots" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
