name: Tests

on:
  pull_request:
  push:
    branches: [claude/cricsynthesis-platform, main]
    paths: ["cricdata/**", "cricsim/**", "cricapi/**", "infra/billing_guard/**", "app/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest cricdata/tests cricsim/tests cricapi/tests infra/billing_guard -q
