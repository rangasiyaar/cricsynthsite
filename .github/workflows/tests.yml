name: Tests

on:
  pull_request:
  push:
    branches: [claude/cricsynthesis-platform, main]
    paths: ["cricdata/**", "cricsim/**", "cricapi/**", "cricmcp/**", "infra/billing_guard/**", "app/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4          # cricmcp parity test runs the browser engine
        with: { node-version: 22 }
      - run: uv sync --all-extras
      - run: uv run pytest cricdata/tests cricsim/tests cricapi/tests cricmcp/tests infra/billing_guard -q

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci && npx tsc --noEmit && npm test && npx next build
