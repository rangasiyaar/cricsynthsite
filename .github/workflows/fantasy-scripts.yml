name: Fantasy scripts

# Match-script fantasy teams: every simulation labelled by how the match went (winner, first-innings third,
# powerplay wickets, close or comfortable); one XI from each of the five most common scripts, against the live XI
# and the live 5-team set. Latest N T20-type and one-day matches, model trained only on the matches before them.
on:
  workflow_dispatch:
    inputs:
      matches: { description: "Latest N matches per format family", default: "200" }

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: T20
            args: ""
          - family: OD
            args: --latest-format OD
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Day key
        id: day
        run: echo "key=parquet-$(date -u +%Y-%m-%d)-${{ hashFiles('cricdata/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: data/parquet
          key: ${{ steps.day.outputs.key }}
      - name: Data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv run cricdata download --kind all --dest data/raw
          uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
            --names data/raw/names.csv --out data/parquet
          uv run cricdata attributes --out data/parquet
          rm -rf data/raw
      - name: Backtest
        env: { N: "${{ inputs.matches || 200 }}" }
        run: |
          uv run python -m cricsim.engine backtest --parquet data/parquet --latest "$N" ${{ matrix.args }} --sims 1000 \
            --fielding both --out data/lab/${{ matrix.family }} --memory 3GB > /dev/null
      - name: Fantasy results
        run: |
          python3 - data/lab/${{ matrix.family }}.json <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          fz = json.load(open(sys.argv[1]))["fantasy"]
          sc = fz["scripts"]
          print(f"## {sys.argv[1]}: {fz['n']} matches, best possible XI {fz['best_possible']} points\n")
          print(f"Real match followed one of the top 5 scripts: **{100 * sc['hit_rate']:.0f}%** of matches; "
                f"the top 5 scripts cover {100 * sc['top5_share_of_sims']:.0f}% of simulations\n")
          print("| Strategy | Avg points | Share of best |\n|---|---|---|")
          for k in ("mean", "script_top1", "script_top5_avg", "portfolio_5", "script_top5_best", "script_oracle", "common_scenario"):
              if k in fz["strategies"]:
                  v = fz["strategies"][k]; print(f"| {k} | {v['points']} | {100 * v['share_of_best']:.1f}% |")
          print("\n| Comparison | Points a match (95% range) | Better / worse |\n|---|---|---|")
          for lab, d in (("v live XI", sc["v_live"]), ("v live best of 5", sc["best_v_portfolio_5"])):
              for k, v in d.items():
                  print(f"| {k} {lab} | {v['diff']:+.1f} ({v['lo']:+.1f} to {v['hi']:+.1f}) | {v['better']} / {v['worse']} of {v['n']} |")
          PY
