name: Cloudflare analytics schema (temporary)
# Read-only: the GraphQL fields for Web Analytics page loads / web vitals and Worker invocations, and a trial run of
# the console's queries. Removed once the console's Traffic page is confirmed.
on: workflow_dispatch
permissions: { contents: read }
jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime as dt
          tok, acct = os.environ["CF"], os.environ["ACCT"]
          def gql(q, v=None):
              r = urllib.request.Request("https://api.cloudflare.com/client/v4/graphql", data=json.dumps({"query": q, "variables": v or {}}).encode(),
                                         headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              return json.loads(urllib.request.urlopen(r, timeout=60).read())
          def fields(t):
              d = gql('query($n:String!){__type(name:$n){fields{name type{name kind ofType{name}}}}}', {"n": t})
              ty = (d.get("data") or {}).get("__type")
              return [(f["name"], f["type"]["name"] or (f["type"]["ofType"] or {}).get("name")) for f in (ty or {}).get("fields") or []] or d.get("errors")
          for t in ["AccountRumWebVitalsEventsAdaptiveGroups", "AccountRumWebVitalsEventsAdaptiveGroupsQuantiles",
                    "AccountRumWebVitalsEventsAdaptiveGroupsSum", "AccountRumWebVitalsEventsAdaptiveGroupsDimensions",
                    "AccountRumPageloadEventsAdaptiveGroupsDimensions"]:
              print("==", t); print(fields(t))
          site = json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.cloudflare.com/client/v4/accounts/{acct}/rum/site_info/list", headers={"Authorization": "Bearer " + tok})).read())
          tags = [(s["site_tag"], s.get("host")) for s in site.get("result", [])]
          print("sites", tags)
          now = dt.datetime.now(dt.timezone.utc); since = (now - dt.timedelta(days=3)).isoformat()
          f = {"siteTag": tags[0][0], "datetime_geq": since, "datetime_leq": now.isoformat()}
          print(json.dumps(gql('''query($a:String!,$f:AccountRumPageloadEventsAdaptiveGroupsFilter_InputObject){viewer{accounts(filter:{accountTag:$a}){
            rumPageloadEventsAdaptiveGroups(limit:5, filter:$f, orderBy:[count_DESC]){count sum{visits} dimensions{requestPath}}}}}''', {"a": acct, "f": f}))[:800])
          print(json.dumps(gql('''query($a:String!,$d:Date!){viewer{accounts(filter:{accountTag:$a}){
            workersInvocationsAdaptive(limit:5, filter:{date_geq:$d}){dimensions{date scriptName} sum{requests errors}}}}}''', {"a": acct, "d": (now - dt.timedelta(days=2)).date().isoformat()}))[:800])
          PY
