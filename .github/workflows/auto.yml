name: Auto

# Fixtures, playing XIs and scorecards from the public score pages (cricsim.auto, competitions in
# cricsim/src/cricsim/auto.json): new fixtures two days out, the named XIs and toss before the start, the scorecard
# once a match is over. What changed is committed and a quick publish is asked for (a bot push alone doesn't start
# one). Free: Actions minutes cost nothing on a public repository.
#
# GitHub runs frequent schedules hours late, which misses the toss, so one run stays up and makes a pass every
# 10 minutes for about 5.5 hours, then starts the next run itself. The schedule only restarts the chain if it
# breaks; the concurrency group keeps a single run (plus at most one queued).
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "One pass that reports what would change; commit nothing"
        type: boolean
        default: false
      list:
        description: "List the scheduled matches and whether we cover them; change nothing"
        type: boolean
        default: false
      minutes:
        description: "How long this run keeps making passes"
        type: number
        default: 330
      late:
        description: "Missed XIs: fixture files (comma-separated) to fetch XIs for now and re-run, then stop"
        type: string
        default: ""

permissions:
  contents: write                  # commit fixtures and scorecards
  actions: write                   # start the quick publish and the next run

concurrency: { group: "${{ (inputs.late || inputs.list || inputs.dry_run) && 'auto-late' || 'auto' }}", cancel-in-progress: false }

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: uv run python -m cricsim.auto --dry-run
      - name: List the schedule
        if: ${{ inputs.list }}
        run: uv run python -m cricsim.auto --list
      - name: Missed XIs, re-run after the start
        if: ${{ inputs.late }}
        env: { GH_TOKEN: "${{ github.token }}", LATE: "${{ inputs.late }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          uv run python -m cricsim.auto --late "$LATE" --changed "$RUNNER_TEMP/rerun.txt"
          git add cricsim/fixtures
          if git diff --cached --quiet; then echo "no XIs found"; exit 0; fi
          git commit -q -m "Late XIs (after the start): $(cat "$RUNNER_TEMP/rerun.txt" | sed 's/\.json//g' | cut -c1-200)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          gh workflow run publish-site.yml --ref "$GITHUB_REF_NAME" -f quick=true -f resimulate="$(cat "$RUNNER_TEMP/rerun.txt")"
      - name: Fixtures, XIs, scorecards every 10 minutes
        if: ${{ !inputs.dry_run && !inputs.late && !inputs.list }}
        env: { GH_TOKEN: "${{ github.token }}", MINUTES: "${{ inputs.minutes || 330 }}" }
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + MINUTES * 60 ))
          while :; do
            git pull --rebase -q origin "$GITHUB_REF_NAME" || git rebase --abort 2>/dev/null || true
            rm -f "$RUNNER_TEMP/rerun.txt"
            uv run python -m cricsim.auto --changed "$RUNNER_TEMP/rerun.txt" || echo "pass failed; retrying next round"
            git add cricsim/fixtures cricsim/results
            if ! git diff --cached --quiet; then
              git commit -q -m "Auto: $(git diff --cached --name-only | sed 's|.*/||; s|\.json||' | paste -sd, - | cut -c1-200)"
              for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
              gh workflow run publish-site.yml --ref "$GITHUB_REF_NAME" -f quick=true -f resimulate="$(cat "$RUNNER_TEMP/rerun.txt" 2>/dev/null)" || true
            fi
            [ $(( $(date +%s) + 600 )) -lt "$end" ] || break
            sleep 600
          done
      - name: Start the next run
        if: ${{ !inputs.dry_run && !inputs.late && !inputs.list && !cancelled() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run auto.yml --ref "$GITHUB_REF_NAME"
