name: Auto

# Fixtures, playing XIs and scorecards from the public score pages (cricsim.auto, competitions in
# cricsim/src/cricsim/auto.json): new fixtures two days out, the named XIs and toss before the start, the scorecard
# once a match is over. What changed is committed and a quick publish is asked for (a bot push alone doesn't start
# one). Free: Actions minutes cost nothing on a public repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would change; commit nothing"
        type: boolean
        default: false

permissions:
  contents: write                  # commit fixtures and scorecards
  actions: write                   # start the quick publish

concurrency: { group: auto, cancel-in-progress: false }

jobs:
  auto:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Fixtures, XIs, scorecards
        run: |
          uv run python -m cricsim.auto --changed "$RUNNER_TEMP/rerun.txt" ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit and publish
        if: ${{ !inputs.dry_run }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git add cricsim/fixtures cricsim/results
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto: $(git diff --cached --name-only | sed 's|.*/||; s|\.json||' | paste -sd, - | cut -c1-200)"
          for i in 1 2 3; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done
          gh workflow run publish-site.yml --ref "$GITHUB_REF_NAME" -f quick=true -f resimulate="$(cat "$RUNNER_TEMP/rerun.txt" 2>/dev/null)"
