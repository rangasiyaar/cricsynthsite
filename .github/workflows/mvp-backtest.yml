name: MVP backtest

# The site's MVP rating on the most recent T20s: model fitted before them, top 11 v the real top fantasy scorers.
on:
  workflow_dispatch:
    inputs:
      matches:
        description: "How many of the most recent T20s"
        default: "100"
  push:
    branches: [claude/cricsynthesis-platform]
    paths: ["cricsim/src/cricsim/engine/mvp_backtest.py", ".github/workflows/mvp-backtest.yml"]

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Day key
        id: day
        run: echo "key=parquet-$(date -u +%Y-%m-%d)-${{ hashFiles('cricdata/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: data/parquet
          key: ${{ steps.day.outputs.key }}
      - name: Data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv run cricdata download --kind all --dest data/raw
          uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
            --names data/raw/names.csv --out data/parquet
          uv run cricdata attributes --out data/parquet
          rm -rf data/raw
      - name: MVP backtest
        run: |
          set -o pipefail
          uv run python -m cricsim.engine.mvp_backtest --parquet data/parquet --matches ${{ inputs.matches || 100 }} --memory 3GB | tee -a "$GITHUB_STEP_SUMMARY"
