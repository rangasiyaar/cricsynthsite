name: Pattern Lab

# Tests cricket folklore on the full Cricsheet archive (free on GitHub's runners,
# no Google setup needed). The report lands in the job summary and as an artifact, and (once Google
# billing is on) in the models bucket for the API. The nightly site build reads the artifact.
on:
  schedule:
    - cron: "0 20 * * 0"           # weekly, Monday 01:30 IST
  workflow_dispatch:
  push:
    branches: [claude/cricsynthesis-platform]
    paths: ["cricsim/**", "cricdata/**", ".github/workflows/pattern-lab.yml"]

permissions:
  contents: read
  id-token: write

concurrency: { group: pattern-lab, cancel-in-progress: true }

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest cricsim/tests cricdata/tests -q
      - name: Download Cricsheet
        run: uv run cricdata download --kind all --dest data/raw
      - name: Build Parquet
        run: |
          uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
            --names data/raw/names.csv --out data/parquet
          uv run cricdata attributes --out data/parquet
          uv run cricdata audit --parquet data/parquet --report data/audit/coverage
          rm data/raw/all_json.zip
      - name: Run Pattern Lab
        run: uv run python -m cricsim.patterns --parquet data/parquet --out data/patterns/report --memory 5GB
      - name: Publish report
        if: always()
        run: |
          [ -f data/patterns/report.md ] && cat data/patterns/report.md >> "$GITHUB_STEP_SUMMARY"
          [ -f data/audit/coverage.md ] && head -40 data/audit/coverage.md >> "$GITHUB_STEP_SUMMARY"
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pattern-lab
          path: |
            data/patterns/
            data/audit/
          if-no-files-found: ignore
      - uses: google-github-actions/auth@v2
        if: ${{ vars.GCP_BILLING == 'true' }}
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: ${{ vars.GCP_BILLING == 'true' }}
      - name: Upload report for the site
        if: ${{ vars.GCP_BILLING == 'true' }}
        run: gcloud storage cp data/patterns/report.json "gs://${{ secrets.GCP_PROJECT_ID }}-models/patterns/report.json"
