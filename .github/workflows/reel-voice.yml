name: Reel voice
on: { workflow_dispatch: }
permissions: { contents: read }
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install -q chatterbox-tts faster-whisper
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Speak
        run: |
          cat > speak.py <<'PY'
          import base64, subprocess, torch, torchaudio as ta
          from chatterbox.tts import ChatterboxTTS
          from faster_whisper import WhisperModel
          LINES = [
            "Then look ahead: forecasts. Twenty endpoints. Win chances, par scores, the toss call, a full fantasy eleven, before every covered match.",
            "Then look ahead. Forecasts: twenty endpoints. Win chances, par scores, the toss call, a full fantasy eleven, before every covered match.",
          ]
          TAKES = [(0.5, 0.5), (0.65, 0.45), (0.8, 0.4)]   # (emotion exaggeration, pacing cfg)
          tts = ChatterboxTTS.from_pretrained(device="cpu")
          asr = WhisperModel("base.en", device="cpu", compute_type="int8")
          for i, line in enumerate(LINES):
              for k, (ex, cfg) in enumerate(TAKES):
                  torch.manual_seed(100 + 10 * i + k)
                  wav = tts.generate(line, exaggeration=ex, cfg_weight=cfg)
                  ta.save("t.wav", wav, tts.sr)
                  text = " ".join(s.text.strip() for s in asr.transcribe("t.wav", beam_size=5)[0])
                  subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", "t.wav", "-c:a", "libopus", "-b:a", "96k", "t.ogg"], check=True)
                  dur = wav.shape[-1] / tts.sr
                  print(f"HEARD {i} {k} {dur:.2f} | {text}", flush=True)
                  print(f"VOICE {i} {k} {dur:.3f} {base64.b64encode(open('t.ogg', 'rb').read()).decode()}", flush=True)
          PY
          python speak.py
