name: Reel voice

# One-off: speaks the Diwali reel's lines with Kokoro (open-source neural text-to-speech, Apache-2.0) and prints each
# line as base64 in the log, so the audio can be fetched without storing it anywhere. Run by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install kokoro-onnx soundfile
      - name: Models
        run: |
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o kokoro.onnx "$B/kokoro-v1.0.onnx"
          curl -sSL -o voices.bin "$B/voices-v1.0.bin"
          ls -la kokoro.onnx voices.bin
      - name: Speak
        run: |
          python - <<'PY'
          import soundfile as sf
          from kokoro_onnx import Kokoro
          LINES = [
            "Someone always asks, who's going to win?",
            "Win chance, score range, when wickets are likely to fall.",
            "And who has the edge in the key duels.",
            "Ball by ball. That's how it learns each player, and each ground.",
            "Then it works out how the match could go, over by over.",
            "Win chances, fantasy picks, batter versus bowler.",
            "All in the app. Free on Android.",
            "Add CricSynthesis to Claude or Chat G P T, and ask about any player, or any match.",
            "Enjoy the sweets and the cricket. Happy Diwali, from all of us at CricSynthesis.",
          ]
          k = Kokoro("kokoro.onnx", "voices.bin")
          import os
          for name, voice in (("female", "af_heart"), ("male", "am_michael")):
              os.makedirs(name, exist_ok=True)
              for i, text in enumerate(LINES, 1):
                  samples, sr = k.create(text, voice=voice, speed=1.0, lang="en-us")
                  sf.write(f"{name}/{i:02d}.wav", samples, sr)
                  print(name, i, round(len(samples) / sr, 2), "s", flush=True)
          PY
      - name: Print audio
        run: |
          for v in female male; do
            for f in $v/*.wav; do
              ffmpeg -loglevel error -y -i "$f" -ac 1 -ar 24000 -b:a 80k "${f%.wav}.mp3"
              echo "==BEGIN $v/$(basename "${f%.wav}").mp3=="
              base64 -w 120 "${f%.wav}.mp3"
              echo "==END=="
            done
          done
