name: Reel voice

# One-off: speaks the API reel's narration with Kokoro (open-source text-to-speech, Apache-2.0) in two
# female voices, and prints each line as base64 Opus in the log. Nothing is stored. Run by hand; removed after use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q kokoro-onnx soundfile && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Models
        run: |
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o kokoro.onnx "$B/kokoro-v1.0.onnx"
          curl -sSL -o voices.bin "$B/voices-v1.0.bin"
      - name: Speak
        run: |
          python - <<'PY'
          import base64, subprocess, soundfile as sf
          from kokoro_onnx import Kokoro
          k = Kokoro("kokoro.onnx", "voices.bin")
          LINES = [
            "Cricket forecasts. One A P I.",
            "Analytics: twenty-five endpoints. Kohli, against off-spin? Eighty-six balls per dismissal.",
            "Forecasts for every covered match. India, sixty-four percent. Both sides should bowl first. And a full fantasy team, with Daryl Mitchell as captain.",
            "Eleven graphics, ready to post, straight from the A P I.",
            "And it works inside Claude, and Chat G P T.",
            "Start free, with two hundred requests a day. Crick Synthesis.",
          ]
          for voice in ("af_heart", "bf_emma"):
              for i, line in enumerate(LINES):
                  audio, sr = k.create(line, voice=voice, speed=1.0, lang="en-us" if voice.startswith("a") else "en-gb")
                  sf.write("l.wav", audio, sr)
                  subprocess.run(["ffmpeg", "-loglevel", "error", "-y", "-i", "l.wav", "-c:a", "libopus", "-b:a", "96k", "l.ogg"], check=True)
                  b = base64.b64encode(open("l.ogg", "rb").read()).decode()
                  print(f"VOICE {voice} {i} {len(audio)/sr:.3f} {b}")
          PY
