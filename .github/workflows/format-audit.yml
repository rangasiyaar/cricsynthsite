name: Format audit

# How a player's T20 and one-day records feed each other, out of sample at three cutoffs: the format deviation's
# prior strength, recent form within and across formats, and players coming into a format.
on:
  workflow_dispatch:
  push:
    branches: [claude/cricsynthesis-platform]
    paths: ["cricsim/src/cricsim/engine/format_audit.py", ".github/workflows/format-audit.yml"]

permissions:
  contents: read

jobs:
  audit:
    name: Format audit · ${{ matrix.cutoff }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cutoff: ["2025-01-01", "2025-07-01", "2026-01-01"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Day key
        id: day
        run: echo "key=parquet-$(date -u +%Y-%m-%d)-${{ hashFiles('cricdata/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: data/parquet
          key: ${{ steps.day.outputs.key }}
      - name: Data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv run cricdata download --kind all --dest data/raw
          uv run cricdata build --zip data/raw/all_json.zip --people data/raw/people.csv \
            --names data/raw/names.csv --out data/parquet
          uv run cricdata attributes --out data/parquet
          rm -rf data/raw
      - name: Format audit
        run: |
          set -o pipefail
          uv run python -m cricsim.engine.format_audit --parquet data/parquet --cutoff ${{ matrix.cutoff }} \
            --memory 4GB | tee -a "$GITHUB_STEP_SUMMARY"
