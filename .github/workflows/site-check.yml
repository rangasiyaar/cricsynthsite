name: Site check
# Smoke test of the live static site (infra/site_check.py): pages, app data with CORS, redirects, headers, MCP index.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Site address"
        default: "https://cricsynthesis.in"
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { BASE: "${{ inputs.base }}" }          # inputs go through env, never pasted into the script
        run: python3 infra/site_check.py "$BASE"
