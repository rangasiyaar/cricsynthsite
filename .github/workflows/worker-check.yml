name: Worker check

# Read-only smoke test of the hosted API on real data. Makes a throwaway Pro test key (its hash goes in the Worker's
# STATIC_KEYS secret for the length of the run), calls each kind of endpoint, then deletes the key. Run by hand.
on:
  workflow_dispatch:
    inputs:
      url: { description: "Worker URL", default: "https://cricsynthesis-api.rangasiyaar.workers.dev" }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test key
        working-directory: edge
        run: |
          npm ci --no-audit --no-fund >/dev/null
          KEY="cs_live_$(openssl rand -hex 16)"
          echo "::add-mask::$KEY"
          echo "KEY=$KEY" >> "$GITHUB_ENV"
          HASH=$(printf '%s' "$KEY" | sha256sum | cut -d' ' -f1)
          printf '{"%s":"pro"}' "$HASH" | npx wrangler secret put STATIC_KEYS
          sleep 15
      - name: Calls
        run: |
          call() {  # path, then what to show
            out=$(curl -s -o /tmp/r -w "%{http_code} %{time_total}s" -H "X-API-Key: $KEY" "$BASE$1")
            echo "$out  $1"
            head -c "${2:-300}" /tmp/r; echo; echo
          }
          curl -s "$BASE/health"; echo
          curl -s "$BASE/v1" | head -c 400; echo; echo
          echo "no key: $(curl -s -o /dev/null -w '%{http_code}' "$BASE/v1/venues")"
          # a well-formed key that isn't in the dashboard: looked up in Firestore, refused (500 = the lookup failed)
          echo "unknown dashboard key: $(curl -s -o /tmp/u -w '%{http_code}' -H "X-API-Key: cs_live_$(openssl rand -hex 16)" "$BASE/v1/venues") $(cat /tmp/u)"
          call "/v1/players?q=kohli"
          PID=$(curl -s -H "X-API-Key: $KEY" "$BASE/v1/players?q=kohli" | python3 -c "import json,sys; print(json.load(sys.stdin)['players'][0]['id'])")
          B=$(curl -s -H "X-API-Key: $KEY" "$BASE/v1/players?q=bumrah" | python3 -c "import json,sys; print(json.load(sys.stdin)['players'][0]['id'])")
          call "/v1/players/$PID"
          call "/v1/players/$PID/phases" 200
          call "/v1/players/$PID/vs-bowling" 200
          call "/v1/players/$PID/similar" 200
          call "/v1/matchups?batter=$PID&bowler=$B" 400
          call "/v1/matchups/grid?batters=$PID&bowlers=$B" 200
          call "/v1/rankings/batting?limit=3" 400
          call "/v1/rankings/bowling?phase=death&sort=economy&limit=3" 300
          call "/v1/venues?q=wankhede" 300
          call "/v1/competitions?q=premier&limit=3" 300
          call "/v1/teams?q=india&limit=3" 300
          call "/v1/trends/scoring" 200
          call "/v1/patterns" 200
          call "/v1/matches" 300
          MID=$(curl -s -H "X-API-Key: $KEY" "$BASE/v1/matches" | python3 -c "import json,sys; print(json.load(sys.stdin)['matches'][0]['id'])")
          call "/v1/matches/$MID" 200
          call "/v1/matches/$MID/fantasy" 200
          call "/v1/graphics/matches/$MID/win.svg" 150
          call "/v1/graphics/players/$PID/profile.svg" 150
          call "/v1/teams/india" 300
          echo "prepared (first match with answers):"
          post() { curl -s -o /tmp/r -w "%{http_code} %{time_total}s" -X POST -H "X-API-Key: $KEY" -H "Content-Type: application/json" "$BASE$1" -d "$2"; echo "  $1"; head -c "${3:-250}" /tmp/r; echo; }
          for M in $(curl -s -H "X-API-Key: $KEY" "$BASE/v1/matches" | python3 -c "import json,sys; print(' '.join(m['id'] for m in json.load(sys.stdin)['matches']))"); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-API-Key: $KEY" -H 'Content-Type: application/json' "$BASE/v1/par-score" -d "{\"match_id\":\"$M\"}")" = 200 ] && break
          done
          echo "match: $M"
          post /v1/par-score "{\"match_id\":\"$M\"}"
          post /v1/chase-curve "{\"match_id\":\"$M\",\"chasing\":1}"
          post /v1/toss "{\"match_id\":\"$M\"}"
          post /v1/lineups/batting-order "{\"match_id\":\"$M\",\"team\":0}"
          post /v1/lineups/bowling-plan "{\"match_id\":\"$M\",\"bowling_team\":1}"
          post /v1/fantasy/team "{\"match_id\":\"$M\"}"
          post /v1/fantasy/portfolio "{\"match_id\":\"$M\",\"teams_count\":3}"
          post /v1/win-probability "{\"match_id\":\"$M\",\"state\":{\"innings\":1,\"batting\":0,\"runs\":80,\"wickets\":2,\"overs\":10.0}}" 400
          post /v1/innings/projection "{\"match_id\":\"$M\",\"state\":{\"runs\":50,\"wickets\":1,\"overs\":6.0}}" 400
          call "/v1/matches/$M/win-probability?innings=2&batting=1&runs=100&wickets=3&overs=15.0&target=160" 400
          echo "again (warm):"; call "/v1/players/$PID/phases" 0; call "/v1/rankings/batting?limit=3" 0
          echo "not hosted: $(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-API-Key: $KEY" "$BASE/v1/simulate")"
          mcp() { curl -s -w "  [%{http_code} %{time_total}s]" -X POST -H "Content-Type: application/json" \
                    -H "Accept: application/json, text/event-stream" "$BASE/mcp" -d "$1" | head -c "${2:-300}"; echo; }
          echo "MCP (no key):"
          mcp '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"check","version":"1"}}}'
          mcp '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' 200
          echo "tools: $(curl -s -X POST -H 'Content-Type: application/json' "$BASE/mcp" -d '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["result"]["tools"]))')"
          mcp '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"list_matches","arguments":{}}}'
          mcp '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"match_forecast","arguments":{"match":"New Zealand v India"}}}' 400
          mcp '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"matchup","arguments":{"batter":"Kohli","bowler":"Bumrah"}}}' 300
          mcp '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"venue_profile","arguments":{"venue":"Wankhede"}}}' 300
          mcp '{"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"toss_decision","arguments":{}}}' 300
          mcp '{"jsonrpc":"2.0","id":8,"method":"tools/call","params":{"name":"par_score","arguments":{}}}' 300
          mcp '{"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"fantasy_team","arguments":{}}}' 300
      - name: Remove the test key
        if: always()
        working-directory: edge
        run: echo y | npx wrangler secret delete STATIC_KEYS || true
