name: Live probe

# One-off checks of the public score pages' data (infra/live/probe*.py). Nothing is published.
on:
  workflow_dispatch:
    inputs:
      finished: { description: "A finished match's page id (blank: one from the live page)", required: false, default: "" }
      upcoming: { description: "An upcoming match's page id (blank: one from the schedule)", required: false, default: "" }
      fetch: { description: "A site data path to print, e.g. matches/<id>.json; skips the probes", required: false, default: "" }

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - if: inputs.fetch == ''
        run: uv run python -m cricsim.auto --list | sort -u
      - if: inputs.fetch != ''
        run: |
          curl -fsS "https://cricsynthesis.in/data/${{ inputs.fetch }}" > out.json
          echo "BEGIN"; cat out.json; echo; echo "END"
