name: Auto check

# Read-only: what the auto loop reads from some match pages, and what one pass would change.
# Writes nothing and does not touch the running loop.
on:
  workflow_dispatch:
    inputs:
      urls: { description: "Match page URLs, space-separated", default: "" }

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: What we read from each page
        if: ${{ inputs.urls != '' }}
        env:
          URLS: ${{ inputs.urls }}
        run: |
          for u in $URLS; do echo "=== $u"; uv run python -m cricsim.khelnow probe "$u" || true; done
      - name: Upcoming matches and whether we cover them
        run: uv run python -m cricsim.auto --list | head -80
      - name: One pass, dry run
        run: uv run python -m cricsim.auto --dry-run
