<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f3;--sf:#e9e9ea;--ink:#1d1f20;--mut:#5a5f64;--line:rgba(29,31,32,.16);--tick:rgba(29,31,32,.08);
  --st:#5980a6;--st7:#416180;--st9:#2c455d;--a:#416180;--b:#b0613a;--as:rgba(65,97,128,.14);--bs:rgba(176,97,58,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:Barlow,system-ui,sans-serif;color:var(--ink)}
.slide{width:1080px;height:1350px;background:var(--bg);position:relative;overflow:hidden;margin:0 0 20px}
.top{position:absolute;left:60px;right:60px;top:52px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font:600 34px/1 'Barlow Condensed';letter-spacing:.02em}
.brand svg{width:40px;height:40px;color:var(--st7)}.brand b{font-weight:600;color:var(--st7)}
.count{font:600 26px/1 'Barlow Condensed';color:var(--mut);letter-spacing:.08em}
.prog{position:absolute;left:60px;right:60px;top:118px;display:flex;gap:8px}.prog i{flex:1;height:5px;background:var(--line)}.prog i.on{background:var(--st7)}
.foot{position:absolute;left:60px;right:60px;bottom:48px;display:flex;justify-content:space-between;align-items:center;
  font:600 25px/1 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase;color:var(--mut);border-top:2px solid var(--line);padding-top:22px}
.foot b{color:var(--st7);font-weight:600;text-transform:none;letter-spacing:.02em;font-size:27px}
.body{position:absolute;left:60px;right:60px;top:160px;bottom:120px;display:flex;flex-direction:column}
.eye{font:600 28px/1 'Barlow Condensed';letter-spacing:.16em;text-transform:uppercase;color:var(--st7)}
h1{font:600 92px/.95 'Barlow Condensed';text-transform:uppercase;letter-spacing:.01em;margin-top:14px}
.k{font:600 25px/1 'Barlow Condensed';letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.card{background:rgba(29,31,32,.035);border:2px solid var(--line);border-radius:6px;padding:28px 32px}
.num{font-family:'Barlow Condensed';font-weight:600;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:28px}
.a{color:var(--a)}.b{color:var(--b)}
.note{font-size:24px;color:var(--mut);margin-top:auto;padding-top:18px}
svg text{font-family:'Barlow Condensed';font-weight:600}
</style></head><body>
<div id="root"></div>
<script>window.CAROUSEL=__DATA__;</script>
<script>
const D=window.CAROUSEL;
const T=D.teams, A=T[0], B=T[1], N=6;
const COL=['var(--a)','var(--b)'], HEX=['#416180','#b0613a'];
const pct=p=>Math.round(p*100)+'%';
const MARK='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4"><path d="M4 15L13 24L4 33" stroke-linecap="square"/><path d="M22 15V40M30 15V40M38 15V40M20 11H29M31 11H40"/></svg>';
const dt=new Date(D.match.date+'T00:00:00'); const day=dt.getDate()+' '+dt.toLocaleString('en-GB',{month:'short'});
const comp=D.match.competition.replace(/\s*\d{4}\s*/,' ').replace(/\s+·\s+/,' · ').trim();
const label=`${A.short} v ${B.short} · ${comp} · ${day}`;
function slide(i,inner){return `<section class="slide" id="s${i}">
 <div class="top"><div class="brand">${MARK}<span>CRIC<b>SYNTHESIS</b></span></div><div class="count">${String(i).padStart(2,'0')} / 0${N}</div></div>
 <div class="prog">${Array.from({length:N},(_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>
 <div class="body">${inner}</div>
 <div class="foot"><span>${label}</span><b>cricsynthesis.in</b></div></section>`}

/* 1. Projected scores (+ match header and win chance) */
function manhattan(w,h){
  const n=D.overs, L=46,R=10,Tp=26,Bt=44, pw=w-L-R, ph=h-Tp-Bt, mx=Math.ceil(Math.max(...A.runs,...B.runs)/4)*4, bw=pw/n;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  s+=`<rect x="${L}" y="${Tp}" width="${pw*D.pp/n}" height="${ph}" fill="rgba(29,31,32,.045)"/>`;
  for(let v=0;v<=mx;v+=mx/4){const y=Tp+ph*(1-v/mx);s+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="var(--tick)" stroke-width="2"/><text x="${L-10}" y="${y+8}" font-size="22" fill="#5a5f64" text-anchor="end">${v}</text>`}
  [A,B].forEach((t,k)=>t.runs.forEach((r,i)=>{const hh=ph*r/mx,x=L+i*bw+bw*(k?.52:.1);s+=`<rect x="${x}" y="${Tp+ph-hh}" width="${bw*.38}" height="${hh}" fill="${HEX[k]}"/>`;
    if(t.wkt_overs.includes(i+1)){s+=`<circle cx="${x+bw*.19}" cy="${Tp+ph-hh-14}" r="9" fill="var(--bg)" stroke="${HEX[k]}" stroke-width="4"/>`}}));
  for(let o=1;o<=n;o++) if((o%(n>20?10:5)===0&&o>D.pp)) s+=`<text x="${L+(o-.5)*bw}" y="${h-12}" font-size="22" fill="#5a5f64" text-anchor="middle">${o}</text>`;
  s+=`<text x="${L+pw*D.pp/n/2}" y="${h-12}" font-size="18" fill="#5a5f64" letter-spacing="2" text-anchor="middle" dy="0">‹ POWERPLAY ›</text></svg>`;return s}
function strip(t,k,lo,hi){const x=v=>(v-lo)/(hi-lo)*100;return `<div style="position:relative;height:16px;margin-top:12px;background:var(--tick);border-radius:8px">
  <div style="position:absolute;left:${x(t.p10)}%;width:${x(t.p90)-x(t.p10)}%;top:0;bottom:0;background:${k?'var(--bs)':'var(--as)'};border-radius:8px"></div>
  <div style="position:absolute;left:${x(t.lo)}%;width:${x(t.hi)-x(t.lo)}%;top:0;bottom:0;background:${COL[k]};opacity:.55;border-radius:8px"></div>
  <div style="position:absolute;left:calc(${x(t.med)}% - 4px);width:8px;top:-8px;bottom:-8px;background:${COL[k]};border-radius:3px"></div></div>`}
function s1(){
  const lo=Math.min(A.p10,B.p10)-10, hi=Math.max(A.p90,B.p90)+10, fav=A.win>=B.win?0:1, gap=Math.abs(A.win-B.win);
  const read=gap<.08?'Too close to call':`${T[fav].short} edge it`;
  const time=D.match.start_time?` · ${D.match.start_time} IST`:'';
  return `<div class="eye">${comp} · Match preview</div>
  <h1 style="font-size:${Math.max(A.name.length,B.name.length)>18?64:80}px;margin-top:14px"><span class="a">${A.name}</span><br><span style="font-size:.6em;color:var(--mut)">v</span> <span class="b">${B.name}</span></h1>
  <div class="sub" style="margin-top:14px">${D.match.venue}${time} · ${day}</div>
  <div class="card" style="margin-top:24px;padding:20px 30px">
   <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="k">Win chance</span><span class="k" style="color:var(--st7)">${read}</span></div>
   <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:8px">
    <span class="num a" style="font-size:84px">${A.short} ${pct(A.win)}</span><span class="num b" style="font-size:84px">${pct(B.win)} ${B.short}</span></div>
   <div style="display:flex;height:22px;margin-top:10px;border-radius:11px;overflow:hidden"><i style="width:${A.win*100}%;background:var(--a)"></i><i style="flex:1;background:var(--b)"></i></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px">
   ${[A,B].map((t,k)=>`<div><div class="k" style="color:${COL[k]}">${t.short} · projected score</div>
     <div style="display:flex;align-items:baseline;gap:16px;margin-top:6px"><span class="num" style="font-size:96px;line-height:1">${t.med}</span><span class="sub">likely ${t.lo}–${t.hi}</span></div>
     ${strip(t,k,lo,hi)}</div>`).join('')}
  </div>
  <div class="k" style="margin-top:26px">Runs per over · <span style="text-transform:none;letter-spacing:.02em">◯ expected wicket</span></div>
  <div style="margin-top:6px">${manhattan(960,220)}</div>
  <div class="sub" style="font-size:26px;margin-top:4px">${D.par?`Par first-innings total <b>${D.par}</b> · `:''}${A.pp&&B.pp?`Powerplay ${A.short} <b>${A.pp[0]}/${A.pp[1]}</b>, ${B.short} <b>${B.pp[0]}/${B.pp[1]}</b>`:''}</div>`}

/* 2. Key duels */
function s2(){if(!D.duels.length)return `<div class="eye">Key duel</div><h1>Who wins<br>the battle?</h1><div class="sub" style="margin-top:40px">The key duels appear once the playing XIs are in. Full match centre at cricsynthesis.in.</div>`;
  const [d0,...rest]=D.duels;
  return `<div class="eye">Key duel</div><h1>Who wins<br>the battle?</h1>
  <div class="card" style="margin-top:44px;padding:44px 40px">
   <div class="k">The duel most likely to decide it</div>
   <div style="font:600 82px/1 'Barlow Condensed';margin-top:22px">${d0[0]}</div>
   <div class="sub" style="font-size:34px;margin:10px 0">dismisses</div>
   <div style="font:600 82px/1 'Barlow Condensed'">${d0[1]}</div>
   <div style="display:flex;align-items:baseline;gap:14px;margin-top:26px"><span class="num" style="font-size:180px;line-height:.9;color:var(--st7)">${pct(d0[2])}</span><span class="sub" style="font-size:34px">chance</span></div>
  </div>
  <div class="k" style="margin-top:46px">Next up</div>
  ${rest.map(d=>`<div style="display:flex;align-items:center;gap:24px;margin-top:22px">
    <div style="flex:1;font-size:34px;font-weight:500">${d[0]} <span class="sub">v</span> ${d[1]}</div>
    <div style="width:240px;height:18px;background:var(--tick);border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:${d[2]/d0[2]*100}%;background:var(--st)"></i></div>
    <div class="num" style="font-size:48px;width:90px;text-align:right">${pct(d[2])}</div></div>`).join('')}
  <div class="note">Chance the bowler gets the batter out, from our match simulations.</div>`}

/* 3. Projected fall of wickets */
function curve(w,h){const n=D.overs,L=56,R=10,Tp=20,Bt=70,pw=w-L-R,ph=h-Tp-Bt,mx=Math.max(.3,Math.ceil(Math.max(...A.pw,...B.pw)*10)/10);
  const x=i=>L+(i+.5)*pw/n,y=v=>Tp+ph*(1-v/mx);
  const bands=A.phases.map(p=>[p[1][0]-1,p[1][1],p[0].toUpperCase()]);
  let s=`<svg width="${w}" height="${h}">`;
  bands.forEach(([a,b,nm],i)=>{if(i!==1)s+=`<rect x="${L+pw*a/n}" y="${Tp}" width="${pw*(b-a)/n}" height="${ph}" fill="rgba(29,31,32,.045)"/>`;
    s+=`<text x="${L+pw*(a+b)/2/n}" y="${h-12}" font-size="22" fill="#5a5f64" text-anchor="middle" letter-spacing="2">${nm}</text>`});
  for(let v=0;v<=mx+1e-9;v+=.1){s+=`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--tick)" stroke-width="2"/><text x="${L-10}" y="${y(v)+8}" font-size="22" fill="#5a5f64" text-anchor="end">${Math.round(v*100)}%</text>`}
  [A,B].forEach((t,k)=>{const pts=t.pw.map((v,i)=>[x(i),y(v)]);const d='M'+pts.map(p=>p.join(',')).join(' L');
    s+=`<path d="${d} L${x(n-1)},${y(0)} L${x(0)},${y(0)} Z" fill="${HEX[k]}" opacity=".13"/><path d="${d}" fill="none" stroke="${HEX[k]}" stroke-width="5" stroke-linejoin="round"/>`;
    t.wkt_overs.forEach(o=>{const [px,py]=pts[o-1];s+=`<circle cx="${px}" cy="${py}" r="13" fill="${HEX[k]}" stroke="#f2f2f3" stroke-width="3"/><text x="${px}" y="${py+7}" font-size="18" fill="#fff" text-anchor="middle">W</text>`})});
  for(let o=1;o<=n;o++) if(o===1||o%(n>20?10:5)===0) s+=`<text x="${x(o-1)}" y="${h-44}" font-size="22" fill="#5a5f64" text-anchor="middle">${o}</text>`;
  return s+'</svg>'}
function s3(){return `<div class="eye">Projected fall of wickets</div><h1>When the<br>wickets fall</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px">
   ${[A,B].map((t,k)=>`<div class="card" style="padding:22px 28px"><div class="k" style="color:${COL[k]}">${t.short} batting</div>
     <div style="display:flex;gap:30px;margin-top:12px"><div><span class="num" style="font-size:72px">${t.first_wkt}</span><div class="sub" style="font-size:24px">first wicket, around over</div></div>
     <div><span class="num" style="font-size:72px">${t.wickets}</span><div class="sub" style="font-size:24px">wickets in all</div></div></div></div>`).join('')}
  </div>
  <div class="k" style="margin-top:26px">Chance of a wicket in each over · <span style="text-transform:none;letter-spacing:.02em">W = expected wicket</span></div>
  <div style="margin-top:8px">${curve(960,330)}</div>
  <table style="width:100%;border-collapse:collapse;margin-top:14px;font-size:28px">
   <tr><th></th>${A.phases.map(p=>`<th class="k" style="text-align:right;padding:8px 0">${p[0]} <span style="color:#8a8f94">${p[1][0]}–${p[1][1]}</span></th>`).join('')}</tr>
   ${[A,B].map((t,k)=>`<tr style="border-top:2px solid var(--line)"><td class="num" style="color:${COL[k]};font-size:34px;padding:10px 0">${t.short}</td>${t.phases.map(p=>`<td style="text-align:right"><span class="num" style="font-size:40px">${p[2]}</span> <span class="sub" style="font-size:22px">wkts</span></td>`).join('')}</tr>`).join('')}
  </table>`}

/* 4. Players to watch */
function bars(rows,k,digits){const mx=Math.max(...rows.map(r=>r[1]),.1);return rows.map(r=>`<div style="margin-top:16px">
  <div style="display:flex;justify-content:space-between;font-size:30px;font-weight:500"><span>${r[0]}</span><span class="num" style="font-size:36px">${digits?r[1].toFixed(1):r[1]}</span></div>
  <div style="height:14px;background:var(--tick);border-radius:7px;margin-top:6px;overflow:hidden"><i style="display:block;height:100%;width:${r[1]/mx*100}%;background:${COL[k]}"></i></div></div>`).join('')}
function s4(){return `<div class="eye">Players to watch</div><h1>Who makes<br>the difference</h1>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:40px;flex:1">
   ${[A,B].map((t,k)=>`<div class="card" style="border-top:8px solid ${COL[k]}">
     <div style="font:600 44px/1 'Barlow Condensed';color:${COL[k]}">${t.short}</div><div class="sub" style="font-size:24px;margin-top:4px">${t.name}</div>
     <div class="k" style="margin-top:30px">Expected runs</div>${bars(t.bats,k,0)}
     <div class="k" style="margin-top:40px">Expected wickets</div>${bars(t.bowls,k,1)}</div>`).join('')}
  </div>
  <div class="note">Averages across our match simulations.</div>`}

/* 5. The ground */
function spark(w,h,runs,avg){const lo=Math.min(...runs,avg)-15,hi=Math.max(...runs,avg)+15,L=20,R=20,x=i=>L+(runs.length<2?.5:i/(runs.length-1))*(w-L-R),y=v=>10+(h-50)*(1-(v-lo)/(hi-lo));
  let s=`<svg width="${w}" height="${h}"><line x1="${L}" x2="${w-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="#5980a6" stroke-width="3" stroke-dasharray="10 8"/>
   <text x="${w-R}" y="${y(avg)-12}" font-size="22" fill="#416180" text-anchor="end">AVERAGE ${Math.round(avg)}</text>
   <path d="M${runs.map((r,i)=>x(i)+','+y(r)).join(' L')}" fill="none" stroke="#416180" stroke-width="5"/>`;
  runs.forEach((r,i)=>{s+=`<circle cx="${x(i)}" cy="${y(r)}" r="10" fill="#416180"/><text x="${x(i)}" y="${y(r)+(r>=avg?-20:38)}" font-size="24" fill="#1d1f20" text-anchor="middle">${r}</text>`});
  return s+'</svg>'}
function s5(){const g=D.ground;if(!g)return `<div class="eye">The ground</div><h1>${D.match.venue}</h1><div class="sub" style="margin-top:30px">Not enough matches here yet.</div>`;
  const tiles=[['First innings',g.first,'typical total'],g.chase!=null?['Chasing wins',pct(g.chase),'of matches here']:null,
    g.pace!=null?['Wickets',`${pct(g.pace)}<span class="sub" style="font-size:40px"> pace</span>`,`${pct(g.spin)} to spin`]:null].filter(Boolean);
  return `<div class="eye">The ground</div><h1>${D.match.venue.split(',')[0]}</h1><div class="sub" style="margin-top:10px">${D.match.venue.split(',').slice(1).join(',').trim()}</div>
  <div style="display:grid;grid-template-columns:repeat(${tiles.length},1fr);gap:24px;margin-top:40px">
   ${tiles.map(t=>`<div class="card"><div class="k">${t[0]}</div><div class="num" style="font-size:96px;line-height:1;margin-top:14px">${t[1]}</div><div class="sub" style="font-size:24px;margin-top:8px">${t[2]}</div></div>`).join('')}
  </div>
  <div class="k" style="margin-top:50px">Last ${g.recent.length} first innings here</div>
  <div style="margin-top:14px">${spark(960,330,g.recent,g.avg)}</div>
  <div class="note">From ${g.matches} recent ${D.match.format} matches at this ground.</div>`}

/* 6. Fantasy picks + call to action */
function s6(){const f=D.fantasy||{c:null,vc:null,must:[]};const tc=s=>s===A.short?0:1;
  const big=(tag,p)=>`<div class="card" style="display:flex;align-items:center;gap:26px;padding:26px 30px">
    <span style="font:700 40px/1 'Barlow Condensed';background:var(--st7);color:#f2f2f3;border-radius:6px;padding:14px 16px;min-width:84px;text-align:center">${tag}</span>
    <span style="font:600 60px/1 'Barlow Condensed';flex:1">${p[0]}</span><span class="num" style="font-size:36px;color:${COL[tc(p[1])]}">${p[1]}</span></div>`;
  return `<div class="eye">Fantasy picks</div><h1>Our picks for<br>your team</h1>
  ${f.c?`<div style="display:grid;gap:18px;margin-top:36px">${big('C',f.c)}${big('VC',f.vc)}</div>`:'<div class="sub" style="margin-top:40px">Fantasy picks appear on the match centre as soon as the projections are ready.</div>'}
  ${f.must.length?'<div class="k" style="margin-top:36px">Must-picks</div>':''}
  ${f.must.map(p=>`<div style="display:flex;justify-content:space-between;font-size:38px;font-weight:500;padding:16px 0;border-bottom:2px solid var(--line)"><span>${p[0]}</span><span class="num" style="color:${COL[tc(p[1])]}">${p[1]}</span></div>`).join('')}
  <div style="margin-top:auto;background:var(--st9);color:#f2f2f3;border-radius:6px;padding:34px 36px">
   <div style="font:600 48px/1.02 'Barlow Condensed';text-transform:uppercase">Full match centre, every player, live win chances</div>
   <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><span style="font:600 40px/1 'Barlow Condensed';color:#8fb3d9">cricsynthesis.in</span><span style="font-size:26px;opacity:.85">Free · Link in bio</span></div>
  </div>
  <div class="note" style="margin-top:14px;padding-top:0;font-size:21px">Projections, not certainties. For analysis and entertainment.</div>`}

document.getElementById('root').innerHTML=[s1(),s2(),s3(),s4(),s5(),s6()].map((h,i)=>slide(i+1,h)).join('');
</script></body></html>
