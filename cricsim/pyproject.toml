[project]
name = "cricsim"
version = "0.1.0"
description = "CricSynthesis simulation engine, player ratings and format rules"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.1",          # pattern lab: window-function features straight off Parquet
    "click>=8.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cricsim"]
